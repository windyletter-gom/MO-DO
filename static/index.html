function resourceDelete(id){wsDelete('/api/resources',id,()=>reopenWorkspaceSection(window._resTid,'RESOURCE'))}
function toggleResourceFields(){
 const isFile=document.getElementById('rs_type').value==='FILE';
 document.getElementById('rs_link_wrap').style.display=isFile?'none':'block';
 document.getElementById('rs_file_wrap').style.display=isFile?'block':'none';
}
function fileToBase64(file){
 return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=reject;r.readAsDataURL(file)})
}
async function saveResource(tid,id){
 const title=document.getElementById('rs_title').value.trim();
 const type=document.getElementById('rs_type').value;
 const desc=document.getElementById('rs_desc').value;
 if(!title){alert('제목을 입력해주세요.');return}
 if(id){ // 수정: 메타데이터(제목/유형/URL/설명)만 갱신. 파일 교체는 삭제 후 재등록.
   const url=document.getElementById('rs_url')?document.getElementById('rs_url').value:'';
   await api('/api/resources/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,resource_type:type,url,description:desc})});
 }else if(type==='FILE'){
   const input=document.getElementById('rs_file');
   const f=input.files[0];
   if(!f){alert('업로드할 파일을 선택해주세요.');return}
   const b64=await fileToBase64(f);
   await api('/api/resources/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({team_id:tid,title:title,description:desc,file_name:f.name,mime_type:f.type||'application/octet-stream',file_base64:b64})});
 }else{
   const url=document.getElementById('rs_url').value;
   await api('/api/resources',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({team_id:tid,title:title,resource_type:type,url:url,description:desc})});
 }
 closeModal();toast('자료를 저장했습니다.');reopenWorkspaceSection(tid,'RESOURCE')
}

async function openSystemHistory(id){
 let t=await api(`/api/task-history/${id}?viewer_id=${currentUser.id}`);
 if(t.error){alert(t.error);return}
 let events=[...(t.logs||[]).map(historyEventFromLog),...(t.comments||[]).map(c=>({kind:'comment',title:'댓글 등록',detail:c.body,actor:c.user_name||'사용자',created_at:c.created_at}))];
 events.sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));
 document.getElementById('modal').classList.add('compact-history-modal');
 showModal('시스템 이력',`<div class="muted">${t.category||'업무'} · ${t.team_name||'-'}</div><h2>${esc(t.title)}</h2><div class="muted">${t.completion_mode==='REVIEW'?'검토·컨펌형':'완료보고형'} · ${t.assignee_name||'미배정'}</div>${t.latest_review_request?reviewHistorySummary(id,t.latest_review_request):''}<div class="system-timeline">${events.map((e,i)=>`<div class="system-event ${e.kind||''}"><span class="system-num">${i+1}</span><div class="system-title">${esc(e.title)}</div><div class="system-detail">${esc(e.detail||'')}</div><div class="system-meta">${formatDateTime(e.created_at)} · ${esc(e.actor||'시스템')}</div></div>`).join('')||'<div class="muted">기록된 이력이 없습니다.</div>'}</div>`);
}
function reviewHistorySummary(taskId,rr){
 let files=(rr.files||[]).map(f=>`<span class="pill">${esc(f.original_name)}</span>`).join('')||'<span class="muted">첨부파일 없음</span>';
 let current=rr.current_approver?.approver_name||((rr.approvals||[]).find(a=>a.status==='WAITING')?.approver_name)||'처리 완료';
 return `<div class="history-review-card"><div class="row" style="justify-content:space-between"><div><b>검토 요청 내역</b><div class="muted">${formatDateTime(rr.created_at)} · ${esc(rr.requester_name||'')}</div></div><span class="pill">${esc(rr.status||'WAITING')}</span></div><div style="margin-top:10px">${esc(rr.comment||'검토 코멘트 없음')}</div><div class="review-files">${files}</div><div class="row" style="justify-content:space-between;margin-top:10px"><span class="muted">현재 승인: ${esc(current)}</span><button class="btn" onclick="openReviewRequest(${taskId})">검토 요청 상세 보기</button></div></div>`;
}

function tdToggleApproval(){let w=document.getElementById('td_approval_wrap');if(w)w.style.display=document.getElementById('td_completion').value==='REVIEW'?'block':'none';}
function tdAddApprover(){let pick=document.getElementById('td_approver_pick');let uid=+pick.value;if(!uid)return;let u=users.find(x=>x.id===uid);window._tdApprovers=window._tdApprovers||[];if(window._tdApprovers.some(a=>a.user_id===uid)){alert('이미 추가된 승인자입니다.');return}window._tdApprovers.push({user_id:uid,name:u?u.name:''});tdRenderApprovers();}
function tdRemoveApprover(uid){window._tdApprovers=(window._tdApprovers||[]).filter(a=>a.user_id!==uid);tdRenderApprovers();}
function tdRenderApprovers(){let el=document.getElementById('td_approver_list');if(!el)return;let l=window._tdApprovers||[];el.innerHTML=l.length?l.map((a,i)=>`<div class="row" style="justify-content:space-between;padding:5px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px"><span><b>${i+1}.</b> ${esc(a.name)}</span><a onclick="tdRemoveApprover(${a.user_id})" style="cursor:pointer;color:#c0392b">삭제</a></div>`).join(''):'<div class="muted">승인자를 추가하세요.</div>';}
function tdAddCoassignee(){let pick=document.getElementById('td_coassignee_pick');let uid=+pick.value;if(!uid)return;let u=users.find(x=>x.id===uid);let role=document.getElementById('td_coassignee_role').value.trim();window._tdCoassignees=window._tdCoassignees||[];if(window._tdCoassignees.some(a=>a.user_id===uid)){alert('이미 추가된 담당자입니다.');return}window._tdCoassignees.push({user_id:uid,role_label:role,name:u?u.name:''});document.getElementById('td_coassignee_role').value='';tdRenderCoassignees();}
function tdRemoveCoassignee(uid){window._tdCoassignees=(window._tdCoassignees||[]).filter(a=>a.user_id!==uid);tdRenderCoassignees();}
function tdRenderCoassignees(){let el=document.getElementById('td_coassignee_list');if(!el)return;let l=window._tdCoassignees||[];el.innerHTML=l.length?l.map(a=>`<span class="pill" style="margin:2px 4px 2px 0;padding:6px 10px">${esc(a.name)}${a.role_label?' · '+esc(a.role_label):''} <a onclick="tdRemoveCoassignee(${a.user_id})" style="cursor:pointer;color:#c0392b">×</a></span>`).join(''):'<span class="muted">공동 담당자가 없습니다.</span>';}
function taskApprovalLineCard(t){
 // 검토·컨펌형만 결재선(승인 순서) 표시. 완료보고형은 승인선이 없음을 명시.
 if(t.completion_mode==='REPORT')return `<div class="card" style="margin:10px 0"><b>검토·승인선</b><div class="muted" style="margin-top:6px">완료보고형 업무입니다. 별도 승인선 없이 담당자의 완료보고로 종료됩니다.</div></div>`;
 if(t.completion_mode!=='REVIEW')return '';
 let ap=(t.approvals||[]);
 let curId=ap.filter(a=>a.status==='WAITING').sort((a,b)=>a.approval_order-b.approval_order)[0]?.id;
 let badge=a=>a.status==='APPROVED'?'<span class="pill" style="background:#e7f6ee;color:#177a4a">승인</span>':a.status==='REJECTED'?'<span class="pill URGENT">반려</span>':a.status==='SKIPPED'?'<span class="pill">자동 제외</span>':(a.id===curId?'<span class="pill" style="background:#edf5fc;color:#285f8b">현재 차례</span>':'<span class="pill">대기</span>');
 let body=ap.length?ap.map((a,i)=>`<div class="row" style="justify-content:space-between;align-items:center;padding:7px 0;${i<ap.length-1?'border-bottom:1px solid var(--line)':''}"><span class="row" style="gap:8px"><span class="approval-stage"><span class="num">${i+1}</span></span><span><b>${esc(a.approver_name)}</b> <span class="muted">${esc(a.team_name||'')} ${esc(a.job_title||a.rank||'')}</span></span></span>${badge(a)}</div>`).join(''):'<div class="muted" style="margin-top:6px">지정된 승인선이 없습니다.</div>';
 return `<div class="card" style="margin:10px 0"><b>검토·승인선</b><div class="muted" style="font-size:12px;margin-bottom:4px">지정된 순서대로 검토가 진행됩니다.</div>${body}</div>`;
}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

async function reviewRequestModal(id){

 <label>지시 내용</label><textarea id="di_body" rows="6" placeholder="업무 목적, 처리 기준, 확인할 사항을 입력하세요."></textarea>
 <div class="two"><div><label>우선순위</label><select id="di_priority"><option value="URGENT">긴급</option><option value="HIGH">높음</option><option value="NORMAL" selected>보통</option><option value="LOW">낮음</option></select></div><div><label>희망 완료일</label><input id="di_due" type="date"></div></div>
 <label>첨부파일 <span class="muted">(캡쳐본·URL 문서·특정 파일 등, 최대 5개)</span></label>
 <input type="file" id="di_files" multiple onchange="dirFilesChanged(this)">
 <div id="di_filelist" class="muted" style="margin-top:6px">첨부 없음</div>
 <div class="row" style="justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn secondary" onclick="closeModal();document.getElementById('modal').classList.remove('full-modal')">취소</button><button class="btn" onclick="sendDirective()">업무지시 전달</button></div>`);
 renderDirRecipients();
}
function dirFilter(){let q=(document.getElementById('di_search')?.value||'').toLowerCase();return (window._dirUsers||[]).filter(u=>!q||[u.name,u.team_name,u.rank,u.job_title].join(' ').toLowerCase().includes(q));}
function renderDirRecipients(){
 let sel=window._dirSelected||new Set();
 document.getElementById('di_recipients').innerHTML=dirFilter().map(u=>`<label class="dir-recipient-item ${sel.has(u.id)?'on':''}"><input type="checkbox" ${sel.has(u.id)?'checked':''} onchange="dirToggle(${u.id},this.checked)"><span><b>${esc(u.name)}</b> <span class="muted">${esc(u.team_name||'')} ${esc(u.rank||u.job_title||'')}</span></span></label>`).join('')||'<div class="muted" style="padding:10px">해당 구성원이 없습니다.</div>';
 document.getElementById('di_selcount').textContent=sel.size;
}
function dirToggle(id,on){let s=window._dirSelected;on?s.add(id):s.delete(id);renderDirRecipients();}
function dirSelectAllVisible(on){dirFilter().forEach(u=>on?window._dirSelected.add(u.id):window._dirSelected.delete(u.id));renderDirRecipients();}
function dirFilesChanged(input){window._dirFiles=Array.from(input.files||[]).slice(0,5);document.getElementById('di_filelist').innerHTML=window._dirFiles.length?window._dirFiles.map(f=>`· ${esc(f.name)} (${formatBytes(f.size)})`).join('<br>'):'첨부 없음';}
async function sendDirective(){
 const ids=[...(window._dirSelected||[])];
 const title=(document.getElementById('di_title')?.value||'').trim();
 const body=(document.getElementById('di_body')?.value||'').trim();
 const priority=document.getElementById('di_priority')?.value||'NORMAL';
 const due=document.getElementById('di_due')?.value||'';
 if(!ids.length){alert('수신자를 1명 이상 선택해주세요.');return}
 if(!title||!body){alert('제목과 지시 내용을 입력해주세요.');return}
 let files=[];for(let f of (window._dirFiles||[]))files.push({name:f.name,mime_type:f.type||'application/octet-stream',data_base64:await fileToBase64(f)});
 try{
   const result=await api('/api/directives',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender_id:currentUser.id,recipient_ids:ids,title,body,priority,due_date:due||null,files})});
   if(!result||result.error)throw new Error(result?.error||'업무지시 저장에 실패했습니다.');
   closeModal();document.getElementById('modal').classList.remove('full-modal');
   toast(`업무지시를 ${result.count||ids.length}명에게 전달했습니다.`);
   await updateNotifBadge();
   currentView==='home'?await home():await notificationsView();
 }catch(e){alert(e.message||'업무지시 전달 중 오류가 발생했습니다.')}
}
async function openDirective(id){
 let [d,replies]=await Promise.all([api('/api/directives/'+id),api('/api/directives/'+id+'/replies')]);
 showModal('업무지시 · '+d.title,`<div class="card" style="margin-bottom:10px"><div class="row"><span class="pill ${d.priority}">${priorityNames[d.priority]||d.priority}</span><span class="pill">${d.status}</span></div><b>${esc(d.body)}</b><div class="muted">${d.sender_name} → ${d.recipient_name}${d.due_date?' · 마감 '+d.due_date:''}</div></div>${(d.files&&d.files.length)?`<div class="card" style="margin-bottom:10px"><b>첨부파일 ${d.files.length}개</b>${d.files.map(f=>`<div class="row" style="justify-content:space-between;margin-top:6px"><span>${esc(f.original_name)} · ${formatBytes(f.size_bytes)}</span><a class="btn secondary" target="_blank" href="/uploads/directive_files/${d.id}/${encodeURIComponent(f.stored_name)}">열기</a></div>`).join('')}</div>`:''}<div class="directive-thread">${replies.map(r=>`<div class="bubble ${r.sender_id==currentUser.id?'me':'other'}"><b>${r.sender_name||''}</b><div>${esc(r.body)}</div><div class="muted">${r.created_at||''}</div></div>`).join('')||'<div class="muted">아직 답변이 없습니다.</div>'}</div><label style="margin-top:12px">답변</label><textarea id="dr_body" rows="4" placeholder="확인 내용, 진행 상황, 문의사항 등을 바로 답변하세요."></textarea><button class="btn" onclick="replyDirective(${id})">답변 보내기</button>`);
}
async function replyDirective(id){
 if(!dr_body.value.trim())return;
 await api('/api/directives/'+id+'/replies',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender_id:currentUser.id,body:dr_body.value.trim()})});
 closeModal();toast('답변을 전송했습니다.');currentView==='home'?home():notificationsView();
}
async function readNotif(id){await api('/api/notifications/'+id+'/read',{method:'PATCH',headers:{'Content-Type':'application/json'},body:'{}'});notificationsView()}
async function updateNotifBadge(){try{let list=await api('/api/notifications?user_id='+currentUser.id);let n=list.filter(x=>!x.is_read).length;let b=document.getElementById('notifBadge');if(b){b.textContent=n||'';b.classList.toggle('show',!!n)}}catch(e){}}


async function showScopedTaskDrill(title,filters={}){
 let scoped={...filters};

 // Dashboard 숫자 집계와 팝업 목록이 반드시 같은 권한/범위를 사용하도록 자동 보정
 if(!scoped.team_id && !scoped.assignee_id && !scoped.project_id){
   if(currentUser.role==='TEAM_LEADER') scoped.team_id=currentUser.team_id;
   else if(currentUser.role!=='DIVISION_ADMIN') scoped.assignee_id=currentUser.id;
 }
 let q='/api/tasks',parts=[];
 if(scoped.team_id)parts.push('team_id='+scoped.team_id);
 if(scoped.assignee_id)parts.push('assignee_id='+scoped.assignee_id);
 if(scoped.project_id)parts.push('project_id='+scoped.project_id);
 if(parts.length)q+='?'+parts.join('&');

 let tasks=await api(q),today=new Date();
 let filtered=tasks.filter(t=>{
   if(scoped.status&&t.status!==scoped.status)return false;
   if(scoped.active&&t.status==='DONE')return false;
   if(scoped.done&&t.status!=='DONE')return false;
   if(scoped.urgent&&!(t.priority==='URGENT'&&t.status!=='DONE'))return false;
   if(scoped.blocked&&t.status!=='BLOCKED')return false;
   if(scoped.attention&&!((t.priority==='URGENT'||t.status==='BLOCKED')&&t.status!=='DONE'))return false;
   if(scoped.progressing&&!(t.status==='IN_PROGRESS'||t.status==='REVIEW'))return false;
   if(scoped.review&&t.status!=='REVIEW')return false;
   if(scoped.delayed&&!(t.due_date&&new Date(t.due_date)<today&&t.status!=='DONE'))return false;
   return true;
 });
 showTaskListModal(`${title} · ${filtered.length}건`,filtered);
}
async function showTaskDrill(type){
 let tasks=await api('/api/tasks');
 let title='업무 목록',filtered=[];
 if(type==='mine_active'){title='나의 진행 업무';filtered=tasks.filter(t=>t.assignee_id==currentUser.id&&t.status!=='DONE')}
 if(type==='blocked'){title='막힘 업무';filtered=tasks.filter(t=>t.status==='BLOCKED')}
 if(type==='urgent'){title='긴급 업무';filtered=tasks.filter(t=>t.priority==='URGENT'&&t.status!=='DONE')}
 showTaskListModal(title,filtered);
}
async function showRequestDrill(direction){
 let list=await api('/api/requests?user_id='+currentUser.id+'&direction='+direction);
 showModal(direction==='incoming'?'나에게 온 요청':'내가 보낸 요청',`<div class="drill-list">${list.map(r=>`<div class="req"><div class="row"><span class="pill">${r.type}</span><span class="pill ${r.priority}">${priorityNames[r.priority]||r.priority}</span><span class="pill">${r.status}</span></div><b>${esc(r.title)}</b><div>${esc(r.content||'')}</div><div class="muted">${r.requester_name||''}${r.target_name?' → '+r.target_name:''} · ${r.due_date||'기한없음'}</div><button class="btn secondary" style="margin-top:8px" onclick="closeModal();openRequestThread(${r.id})">${direction==='incoming'?'내용 확인 / 답변':'대화 보기'}</button></div>`).join('')||'<div class="muted">해당 요청이 없습니다.</div>'}</div>`);
}
function showBoardStage(status){
 let tasks=window._currentBoardTasks||[];
 showTaskListModal(statusNames[status]+' 업무',tasks.filter(t=>t.status===status));
}
function showManagementDrill(type){
 let tasks=window._managementTasks||[],today=new Date(),filtered=tasks,title='업무 목록';
 if(type==='blocked'){title='막힘 업무';filtered=tasks.filter(t=>t.status==='BLOCKED')}
 if(type==='urgent'){title='긴급 업무';filtered=tasks.filter(t=>t.priority==='URGENT')}
 if(type==='review'){title='검토대기 업무';filtered=tasks.filter(t=>t.status==='REVIEW')}
 if(type==='delayed'){title='지연 업무';filtered=tasks.filter(t=>t.due_date&&new Date(t.due_date)<today)}
 if(type==='active'){title='진행 업무 전체';filtered=tasks}
 showTaskListModal(title,filtered);
}
function showTaskListModal(title,tasks){
 showModal(title,`<div class="muted" style="margin-bottom:10px">업무 상세, 시스템 이력, 검토 요청 내역을 바로 확인할 수 있습니다.</div><div class="drill-rich-list">${tasks.map(drillTaskCard).join('')||'<div class="muted">해당 업무가 없습니다.</div>'}</div>`);
}
function drillTaskCard(t){
 let reviewBtn=t.completion_mode==='REVIEW'&&t.status==='REVIEW'?`<button class="btn" onclick="openReviewRequest(${t.id})">검토 요청 내역</button>`:'';
 return `<div class="drill-rich-card"><div class="row" style="justify-content:space-between"><div><span class="pill">${esc(t.category||'업무')}</span> <span class="pill">${statusNames[t.status]||t.status}</span></div><span class="muted">${t.due_date||'마감 없음'}</span></div><h3>${esc(t.title)}</h3><div class="muted">${t.team_name||'-'} · ${t.assignee_name||'미배정'} · ${t.completion_mode==='REVIEW'?'검토·컨펌형':'완료보고형'}</div><div class="actions"><button class="btn secondary" onclick="openTaskDetail(${t.id})">업무 상세</button><button class="btn secondary" onclick="openSystemHistory(${t.id})">시스템 이력</button>${reviewBtn}</div></div>`;
}
async function searchView(){
 view.innerHTML=`<div class="card"><div class="searchbar"><select id="search_team"><option value="">전체 팀</option>${teams.filter(t=>t.active).map(t=>`<option value="${t.id}">${t.name}</option>`)}</select><select id="search_status"><option value="">전체 상태</option>${Object.entries(statusNames).map(([k,v])=>`<option value="${k}">${v}</option>`)}</select><input id="search_q" placeholder="업무명, 프로젝트, 담당자 검색" onkeydown="if(event.key==='Enter')runSearch()"><button class="btn" onclick="runSearch()">검색</button></div></div><div id="search_result" class="section"></div>`;
 runSearch();
}
async function runSearch(){
 let tasks=await api('/api/tasks'),q=(document.getElementById('search_q')?.value||'').trim().toLowerCase(),team=document.getElementById('search_team')?.value||'',status=document.getElementById('search_status')?.value||'';
 let filtered=tasks.filter(t=>{
   let hay=[t.title,t.description,t.project_name,t.assignee_name,t.team_name].join(' ').toLowerCase();
   return (!q||hay.includes(q))&&(!team||t.team_id==team)&&(!status||t.status===status);
 });
 search_result.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h3>검색 결과</h3><span class="pill">${filtered.length}건</span></div>${filtered.map(taskCard).join('')||'<div class="muted">검색 결과가 없습니다.</div>'}</div>`;
}
async function exportOperationData(){
 let data=await api('/api/export?actor_id='+currentUser.id);
 let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='MOA_WORK_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);
 toast('운영 데이터 백업 파일을 저장했습니다.');
}

function toast(s){let x=document.createElement('div');x.textContent=s;x.style='position:fixed;right:20px;bottom:20px;background:#222;color:#fff;padding:12px 16px;border-radius:10px;z-index:99';document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
boot();
</script></body></html>
