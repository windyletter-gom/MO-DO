<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>모두 (MO DO)</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--line:#e7e8ef;--txt:#1f2330;--muted:#73798a;--pri:#6557e8}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--txt)}
/* 로그인 페이지 */
.login-page{position:fixed;inset:0;z-index:100;display:flex;background:linear-gradient(135deg,#16182b 0%,#242844 55%,#2f3566 100%)}
.login-brand{position:relative;flex:1.1;display:flex;flex-direction:column;justify-content:center;padding:6vw;color:#fff;overflow:hidden}
.login-brand:before{content:"";position:absolute;top:-15%;left:-10%;width:60%;height:70%;background:radial-gradient(circle,rgba(90,150,255,.28),transparent 68%);filter:blur(10px);pointer-events:none}
.brand-lockup{display:flex;align-items:center;gap:22px;position:relative}
.brand-mark{width:clamp(72px,8vw,104px);height:clamp(72px,8vw,104px);border-radius:26px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 34px rgba(20,40,90,.45),inset 0 1px 0 rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.brand-mark img{width:64%;height:64%;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(0,0,0,.25))}
.brand-modo{font-size:clamp(58px,8.4vw,108px);font-weight:900;line-height:.95;letter-spacing:-.01em;background:linear-gradient(180deg,#ffffff 0%,#cfe0ff 78%,#a8c4ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.brand-en{display:flex;align-items:center;gap:12px;margin-top:12px}
.brand-en .en-txt{font-size:clamp(16px,2vw,26px);font-weight:800;letter-spacing:.5em;color:#8fb0ff;padding-left:.5em}
.brand-en .en-bar{width:clamp(30px,4vw,54px);height:3px;border-radius:3px;background:linear-gradient(90deg,#4f8cff,#8fb0ff)}
.brand-rule{width:64px;height:4px;border-radius:4px;background:linear-gradient(90deg,#3f7df6,#8fb0ff);margin:34px 0 22px;position:relative}
.brand-mean{font-size:clamp(17px,1.9vw,24px);font-weight:700;color:#fff;line-height:1.6;position:relative}
.brand-mean b{background:linear-gradient(90deg,#7fb0ff,#b9d0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.modo-tag{font-size:clamp(14px,1.4vw,18px);line-height:1.8;color:#aab4d6;margin-top:8px;position:relative}
.login-panel{flex:.9;background:#fff;display:flex;align-items:center;justify-content:center;padding:5vw}
.login-card{width:min(380px,100%)}
.login-card h2{margin:0 0 4px;font-size:24px}
.login-card .sub{color:var(--muted);margin-bottom:24px;font-size:14px}
.login-card label{display:block;font-size:13px;color:var(--muted);margin:14px 0 5px}
.login-card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px}
.login-card .login-btn{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.login-card .login-btn:hover{filter:brightness(1.06)}
.login-err{color:#c0392b;font-size:13px;margin-top:12px;min-height:18px}
.login-hint{margin-top:20px;font-size:12px;color:var(--muted);line-height:1.7;background:#f6f7fb;border-radius:9px;padding:11px 12px}
.userbox{display:flex;align-items:center;gap:10px}
.userbox .uname{font-weight:700}.userbox .btn-mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px}
.userbox .btn-mini:hover{background:#f1f3f8}
@media(max-width:820px){.login-brand{display:none}.login-panel{flex:1}}
.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:#16182b;color:white;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.nav-version{margin-top:auto;padding:12px 10px 4px;border-top:1px solid #2a2d45;color:#9ca0b8;font-size:12px;line-height:1.5}
.nav-version b{color:#d8daea;font-size:13px;letter-spacing:.5px}
.logo{display:flex;align-items:center;gap:11px;margin:6px 6px 26px;min-width:0}
.logo .logo-mark{width:40px;height:40px;border-radius:12px;flex:0 0 40px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
.logo .logo-mark img{width:66%;height:66%;object-fit:contain}
.logo .brand-wrap{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.logo .brand-title{font-size:22px;font-weight:900;line-height:1;white-space:nowrap;background:linear-gradient(180deg,#ffffff,#bcd0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .brand-version{font-size:10px;letter-spacing:.34em;color:#8fb0ff;margin-top:5px;font-weight:700;white-space:nowrap}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#d8daea;padding:12px;border-radius:10px;margin:3px 0;cursor:pointer;font-size:14px}
.nav button:hover,.nav button.active{background:#2a2d48;color:#fff}.main{padding:22px 26px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.userSel{padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 10px #00000008}
.metric b{font-size:26px}.muted{color:var(--muted);font-size:12px}.section{margin-top:18px}.section h3{margin:0 0 10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.req{padding:11px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fff}.pill{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;background:#eef0f6;margin-right:5px}
.URGENT{background:#ffe7e7;color:#c72727}.HIGH{background:#fff0dc;color:#b46300}.NORMAL{background:#e8efff;color:#355cc9}.LOW{background:#eef0f3;color:#6b7280}
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto}.col{background:#eef0f6;border-radius:12px;padding:10px;min-height:320px}.col h4{margin:3px 4px 10px}.task{background:#fff;border:1px solid var(--line);padding:11px;border-radius:10px;margin:8px 0;cursor:grab}.task.dragging{opacity:.45}.task .title{font-weight:700;margin:6px 0}.task .small{font-size:11px;color:var(--muted);line-height:1.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;background:var(--pri);color:white;border-radius:9px;padding:9px 12px;cursor:pointer}.btn.secondary{background:#ececf5;color:#333}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:20}.modal.show{display:flex}.modalbox{width:min(620px,92vw);background:#fff;border-radius:16px;padding:20px;max-height:90vh;overflow:auto}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;margin:5px 0 10px}label{font-size:12px;color:var(--muted)}
.profile{padding:10px;border:1px solid var(--line);border-radius:10px;margin:7px 0}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:9px;cursor:pointer}.tabs button.active{background:var(--pri);color:#fff;border-color:var(--pri)}
/* calendar */
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line);background:#fff}
.dow,.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.dow{padding:8px;text-align:center;font-weight:700;background:#fafafe}.day{min-height:120px;padding:7px}.day.other{background:#fafafa;color:#aaa}.date{font-size:12px;font-weight:700;margin-bottom:6px}.event{font-size:10px;border-radius:5px;padding:4px 5px;margin:3px 0;background:#ece9ff;border-left:3px solid var(--pri)}.event small{display:block;color:#666}
.workspace-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.module-card{cursor:pointer;min-height:110px}.module-card:hover{outline:2px solid #d9d5ff}

.detail-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
.comment{padding:10px;border:1px solid var(--line);border-radius:9px;margin:8px 0;background:#fff}
.comment b{font-size:12px}.activity{font-size:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.board-builder{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.task{cursor:pointer}.task[draggable=true]{cursor:grab}

.management-summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.person-block{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;margin:10px 0}
.person-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.directive-thread{max-height:280px;overflow:auto;background:#f8f9fc;border-radius:10px;padding:10px}
.bubble{padding:9px 11px;border-radius:10px;margin:6px 0;background:#fff;border:1px solid var(--line)}
.bubble.me{margin-left:35px;background:#eeecff}
.bubble.other{margin-right:35px}

.metric.clickable{cursor:pointer;transition:.15s}.metric.clickable:hover{transform:translateY(-1px);box-shadow:0 5px 18px #00000012;outline:1px solid #d9d5ff}
.count-badge{display:inline-flex;min-width:22px;height:22px;padding:0 7px;align-items:center;justify-content:center;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:11px;margin-left:5px;cursor:pointer}
.stage-head{display:flex;justify-content:space-between;align-items:center}
.drill-list .task{cursor:pointer}
.searchbar{display:grid;grid-template-columns:180px 180px 1fr auto;gap:8px}

.workspace-shell{display:grid;grid-template-columns:210px 1fr;gap:14px}
.workspace-menu{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;height:max-content;position:sticky;top:16px}
.workspace-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:8px;cursor:pointer}
.workspace-menu button:hover,.workspace-menu button.active{background:#eeecff}
.timeline-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1.2fr;gap:8px;padding:10px;border-bottom:1px solid var(--line);align-items:center}
.timeline-overdue{background:#fff0f0}
.timeline-bar{height:10px;background:#e9ebf2;border-radius:99px;overflow:hidden}.timeline-fill{height:100%;background:#6557e8}
.meeting-layout{display:grid;grid-template-columns:340px 1fr;gap:14px}.meeting-list{max-height:640px;overflow:auto}.meeting-item{padding:10px;border-bottom:1px solid var(--line);cursor:pointer}.meeting-item:hover,.meeting-item.active{background:#f0efff}
.big-note{white-space:pre-wrap;line-height:1.7;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:320px}
.finance-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ws-team-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.context-hint{font-size:12px;color:var(--muted);margin:4px 0 12px}

.blocked-card{border:1px solid #ffd0d0;background:#fffafa;border-radius:12px;padding:12px;margin:9px 0}

.blocked-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.blocked-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.view-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.view-tabs button{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:9px;cursor:pointer}
.view-tabs button.active{background:#6557e8;color:#fff;border-color:#6557e8}
.dashboard-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
.chart-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.donut-wrap{display:flex;align-items:center;gap:22px}
.donut{width:160px;height:160px;border-radius:50%;position:relative;flex:0 0 160px}
.donut:after{content:'';position:absolute;inset:30px;background:#fff;border-radius:50%}
.legend-row{display:flex;align-items:center;gap:7px;margin:7px 0;font-size:12px}
.legend-dot{width:10px;height:10px;border-radius:50%}
.progress-row{margin:10px 0}.progress-track{height:10px;background:#eceef4;border-radius:99px;overflow:hidden}.progress-fill{height:100%;background:#6557e8}
.timeline-view{overflow:auto}.timeline-table{min-width:980px}
.timeline-item{display:grid;grid-template-columns:220px 120px 1fr 120px;gap:8px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.timeline-axis{position:relative;height:34px;background:repeating-linear-gradient(to right,#f3f4f8 0,#f3f4f8 1px,transparent 1px,transparent 12.5%)}
.timeline-segment{position:absolute;height:18px;top:8px;border-radius:5px;background:#6557e8}
.kanban-mini{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:10px;overflow:auto}
.calendar-mini{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line)}
.calendar-mini>div{min-height:90px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px}
.executive-team{cursor:pointer}.executive-team:hover{background:#fafafe}

.service-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.customer-grid{display:grid;grid-template-columns:360px 1fr;gap:14px}
.customer-list{max-height:680px;overflow:auto}
.customer-item{padding:11px;border-bottom:1px solid var(--line);cursor:pointer}.customer-item:hover,.customer-item.active{background:#f0efff}
.quick-answer{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fff}
.knowledge-search{display:grid;grid-template-columns:1fr 180px auto;gap:8px}
.service-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.marketing-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.marketing-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.marketing-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;margin:8px 0}
.marketing-metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.planning-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.planning-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.planning-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;margin:8px 0}

.review-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.review-tabs{display:flex;gap:8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px;margin:14px 0}
.review-tabs button{border:0;background:transparent;padding:10px 14px;border-radius:8px;cursor:pointer}
.review-tabs button.active{background:#184a78;color:#fff}
.review-progress{height:8px;background:#e8edf3;border-radius:99px;overflow:hidden;min-width:160px}.review-progress>span{display:block;height:100%;background:#4d83b5}
.review-table td,.review-table th{vertical-align:middle}
.review-badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;background:#eef3f8}

.review-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.choice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 14px}.choice-grid.two-choice{grid-template-columns:1fr 1fr}

.checkbox-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.check-card{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.check-card input{width:auto}

.data-center-head .eyebrow{font-size:10px;letter-spacing:2px;font-weight:800;color:#71839a}.data-tabs{display:flex;gap:8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px;margin:14px 0}.data-tabs button{border:0;background:transparent;padding:10px 14px;border-radius:8px;cursor:pointer}.data-tabs button.active{background:#285f8b;color:#fff}.data-upload-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.data-type-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.data-type-card{border:1px solid var(--line);background:#fff;border-radius:10px;padding:14px;min-height:110px;text-align:left;cursor:pointer}.data-type-card.selected{border:2px solid #4e7aa5;background:#eef5fb}.data-dropzone{border:1.5px dashed #79a3ca;border-radius:12px;background:#f8fbff;min-height:250px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}.data-dropzone.drag{background:#edf6ff}.data-history-table tr{cursor:pointer}.data-history-table tr:hover{background:#f8fafc}.status-ok{color:#14785f}.status-warn{color:#a86700}.status-error{color:#b23b3b}.data-summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.file-icon{width:34px;height:34px;border-radius:8px;background:#edf3f8;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#315f86}

/* v2.1.5 UI */
.main{background:#f4f7fb}
.top{background:#f4f7fb;border-bottom:0;padding-bottom:8px}
.page-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:14px}
.page-hero h1{font-size:28px;margin:4px 0 6px;letter-spacing:-.8px}
.page-kicker{font-size:11px;font-weight:800;letter-spacing:1.8px;color:#6e8097}
.guide-strip{display:flex;justify-content:space-between;align-items:center;border:1px solid #cedbea;border-radius:10px;background:#f5f9fd;padding:10px 14px;margin-bottom:14px}

<script>
let users=[],teams=[],projects=[],currentUser=null,currentView='home',calDate=new Date(),navContext={workspaceTeamId:null,workspaceSection:null,projectId:null,boardId:null,projectMode:null};
const statusNames={TODO:'업무대기',IN_PROGRESS:'진행중',BLOCKED:'막힘',REVIEW:'검토/확인',DONE:'완료'};
const priorityNames={URGENT:'긴급',HIGH:'높음',NORMAL:'보통',LOW:'낮음'};
const eventNames={GENERAL:'일반',MEETING:'회의',SHOOT:'촬영',MARKETING:'마케팅',REVIEW:'심사/검토',SERVICE:'서비스운영',TASK_DUE:'업무마감'};
async function api(url,opt){let r=await fetch(url,opt);if(r.status===401){try{localStorage.removeItem('modo_user')}catch(e){};if(!url.includes('/api/login'))showLogin();throw new Error(await r.text())}if(!r.ok)throw new Error(await r.text());return r.json()}
// 최고관리자: 정해근·이원행 또는 SUPER_ADMIN 역할
function isSuperAdmin(u){u=u||currentUser;return !!u&&(u.role==='SUPER_ADMIN'||u.name==='정해근'||u.name==='이원행')}
// 전체 팀 열람 권한: 이사·부서관리자·최고관리자만. 팀장/사원은 본인 팀만.
function canSeeAllTeams(){return isSuperAdmin()||isExecutiveUser()||currentUser.role==='DIVISION_ADMIN'}
function applyAdminVisibility(){
 let btn=document.getElementById('adminNav');
 if(!btn||!currentUser)return;
 btn.style.display=isSuperAdmin()?'flex':'none';
}
async function boot(){
 // 서버의 HttpOnly 세션 쿠키가 유효한지 확인한다.
 try{
   let me=await api('/api/session');
   if(me&&me.user){try{localStorage.setItem('modo_user',JSON.stringify({id:me.user.id,email:me.user.email}))}catch(e){};await startApp(me.user);return}
 }catch(e){}
 showLogin();
}
function showLogin(){
 document.getElementById('loginPage').style.display='flex';
 document.querySelector('.app').style.display='none';
 setTimeout(()=>{let e=document.getElementById('login_email');if(e)e.focus()},50);
}
async function doLogin(){
 let email=(document.getElementById('login_email').value||'').trim();
 let pw=document.getElementById('login_pw').value||'';
 let err=document.getElementById('login_err');err.textContent='';
 if(!email||!pw){err.textContent='이메일과 비밀번호를 입력해주세요.';return}
 let r;
 try{r=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})})}
 catch(e){err.textContent=parseApiError(e,'로그인에 실패했습니다.');return}
 if(!r||r.error){err.textContent=(r&&r.error)?r.error:'로그인에 실패했습니다.';return}
 try{localStorage.setItem('modo_user',JSON.stringify({id:r.user.id,email:r.user.email}))}catch(e){}
 await startApp(r.user);
}
async function doLogout(){try{await fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})}catch(e){}try{localStorage.removeItem('modo_user')}catch(e){}location.reload();}
function parseApiError(e,fallback){try{let m=JSON.parse(String(e.message||e));return m.error||fallback}catch(_){return fallback}}
async function startApp(u){
 document.getElementById('loginPage').style.display='none';
 document.querySelector('.app').style.display='grid';
 [users,teams]=await Promise.all([api('/api/users'),api('/api/teams')]);
 currentUser=users.find(x=>x.id===u.id)||u;
 if(!currentUser)throw new Error('사용자 정보를 불러오지 못했습니다.');
 document.getElementById('ub_name').textContent=`${currentUser.name} · ${currentUser.team_name||'총괄'} ${currentUser.rank||''}`;
 applyAdminVisibility();
 projects=await api('/api/projects?viewer_id='+currentUser.id);
 document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentView=b.dataset.view;navContext={workspaceTeamId:null,workspaceSection:null,projectId:null,boardId:null,projectMode:null};render()});
 render();updateNotifBadge();updateSidebarBadges();
}
function changePasswordModal(){
 showModal('개인 설정 · 비밀번호 변경',`<div class="muted" style="margin-bottom:10px">${esc(currentUser.name)} · ${esc(currentUser.email||'')}</div><label>현재 비밀번호</label><input id="cp_cur" type="password"><label>새 비밀번호(4자 이상)</label><input id="cp_new" type="password"><label>새 비밀번호 확인</label><input id="cp_new2" type="password"><div id="cp_err" class="login-err"></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn secondary" onclick="closeModal()">취소</button><button class="btn" onclick="saveChangePassword()">변경</button></div>`);
}
async function saveChangePassword(){
 let cur=cp_cur.value,nw=cp_new.value,nw2=cp_new2.value,err=document.getElementById('cp_err');err.textContent='';
 if(nw!==nw2){err.textContent='새 비밀번호가 일치하지 않습니다.';return}
 if((nw||'').length<4){err.textContent='새 비밀번호는 4자 이상이어야 합니다.';return}
 let r;
 try{r=await api('/api/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:currentUser.id,current_password:cur,new_password:nw})})}
 catch(e){err.textContent=parseApiError(e,'변경에 실패했습니다.');return}
 if(!r||r.error){err.textContent=(r&&r.error)?r.error:'변경에 실패했습니다.';return}
 closeModal();toast('비밀번호를 변경했습니다.');
}

async function refreshCurrentContext(){
 if(navContext.boardId&&navContext.workspaceTeamId){await openBoardInWorkspace(navContext.workspaceTeamId,navContext.boardId);return}
 if(navContext.projectId){await refreshProject(navContext.projectId,navContext.projectMode);return}
 if(navContext.workspaceTeamId&&navContext.workspaceSection){
   await reopenWorkspaceSection(navContext.workspaceTeamId,navContext.workspaceSection);return
 }
 await render();
}
async function refreshProject(id,mode=null){
 projects=await api('/api/projects?viewer_id='+currentUser.id);
 await openProject(id,mode||navContext.projectMode||'DASHBOARD');
}
async function reopenWorkspaceSection(tid,code){
 let w=await api('/api/workspace/'+tid);pageTitle.textContent=`${w.team.name} WORKSPACE`;
 let common=[['OVERVIEW','오버뷰'],['TASKS','업무/프로젝트'],['SCHEDULE','일정 관리'],['MEETING','회의록'],['PURCHASE','구매내역'],['BOOK','독서토론'],['CHECKLIST','체크리스트'],['RESOURCE','자료/링크'],['DATACENTER','데이터 관리 센터'],['DATABOARD','데이터보드'],['KPI','KPI']];
 if(tid===1) common.splice(6,0,['REFUND','환불과정 관리'],['MCC_REVIEW','교재·법령 검수']);
 if(tid===6){
   common.splice(2,0,['CUSTOMER','고객 DB / 온보딩'],['CONSULT','상담 관리'],['KNOWLEDGE','상담 지식DB'],['STUDY','상품/과정 스터디']);
 }
 if(tid===2){
   common.splice(2,0,['MKT_OVERVIEW','마케팅 통합현황'],['MKT_CHANNEL','채널 운영'],['MKT_CAMPAIGN','광고·캠페인'],['MKT_CONTENT','콘텐츠 캘린더'],['MKT_LEAD','리드·유입 관리'],['MKT_EVENT','행사·프로모션'],['MKT_COLLAB','협업 요청'],['MKT_RESULT','성과 데이터']);
 }
 if(tid===3){
   common.splice(2,0,['PLAN_OVERVIEW','기획 통합현황'],['PLAN_LIVE','라이브특강'],['PLAN_PROMO','프로모션·이벤트'],['PLAN_PRODUCT','상품·가격 관리'],['PLAN_B2B','B2B 판매 관리'],['PLAN_SITE','사이트 운영']);
 }
 view.innerHTML=`<div class="workspace-shell"><aside class="workspace-menu"><h3 style="padding:6px 8px">${w.team.name}</h3>${common.map(m=>`<button class="${m[0]===code?'active':''}" onclick="workspaceSection(${tid},'${m[0]}',this)">${m[1]}</button>`).join('')}</aside><section id="wsBody"></section></div>`;
 let btn=[...document.querySelectorAll('.workspace-menu button')].find(b=>b.getAttribute('onclick')?.includes(`'${code}'`));
 await workspaceSection(tid,code,btn);
}

async function render(){
 hello.textContent=`${currentUser.name} ${currentUser.rank||''} · ${currentUser.team_name||'콘텐츠사업부'} · 내선 ${currentUser.extension||'-'} · ${currentUser.email||''}`;
 pageTitle.textContent={home:'홈',mywork:'업무관리',projects:'프로젝트',calendar:'캘린더',teams:'팀 워크스페이스',notices:'공지 게시판',notifications:'알림',search:'검색',directory:'구성원',admin:'관리자'}[currentView];
 if(currentView==='home')return home(); if(currentView==='mywork')return mywork(); if(currentView==='projects')return projectList(); if(currentView==='calendar')return calendarView(); if(currentView==='teams')return teamView(); if(currentView==='notices')return noticesBoard(); if(currentView==='notifications')return notificationsView(); if(currentView==='search')return searchView(); if(currentView==='directory')return directory(); if(currentView==='admin')return adminCenter();
}
async function home(){
 const [d,inc,out,tasks,blockedPriority,urgentPriority,projectsNow,myReviewTasks,inDirectives,outDirectives,notices]=await Promise.all([
   api('/api/dashboard?user_id='+currentUser.id),
   api('/api/requests?user_id='+currentUser.id+'&direction=incoming'),
   api('/api/requests?user_id='+currentUser.id+'&direction=outgoing'),
   api('/api/tasks?viewer_id='+currentUser.id),
   api('/api/blocked-priority?viewer_id='+currentUser.id),
   api('/api/urgent-priority?viewer_id='+currentUser.id),
   api('/api/projects?viewer_id='+currentUser.id),
   api('/api/work-management?viewer_id='+currentUser.id+'&scope=review'),
   api('/api/directives?user_id='+currentUser.id+'&direction=incoming'),
   api('/api/directives?user_id='+currentUser.id+'&direction=outgoing'),
   api('/api/notices?limit=5')
 ]);
 let open=tasks.filter(t=>t.status!=='DONE'),todo=open.filter(t=>t.status==='TODO'),doing=open.filter(t=>t.status==='IN_PROGRESS'||t.status==='BLOCKED'),review=open.filter(t=>t.status==='REVIEW'),done=tasks.filter(t=>t.status==='DONE');
 let completion=tasks.length?Math.round(done.length/tasks.length*100):0;
 let today=new Date(),todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
 let todayTasks=open.filter(t=>!t.due_date||t.due_date<=todayStr).slice(0,6);
 let avg=projectsNow.length?Math.round(projectsNow.reduce((a,p)=>a+(p.task_count?Math.round(p.done_count/p.task_count*100):0),0)/projectsNow.length):0;
 let waitingApprovals=(projectsNow||[]).reduce((a,p)=>a+(p.waiting_approvals||0),0)+(Array.isArray(myReviewTasks)?myReviewTasks.length:0);
 let urgentIds=new Set(urgentPriority.map(x=>x.id)),priority=[...urgentPriority,...blockedPriority.filter(x=>!urgentIds.has(x.id))];
 let days=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
 view.innerHTML=`<div class="page-hero"><div><div class="page-kicker">${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일 ${days[today.getDay()]}</div><h1>좋은 하루예요, ${currentUser.name}님</h1><div class="muted">오늘 확인할 업무와 데이터 처리 현황을 한곳에 모았습니다.</div></div><div class="row">${isExecutiveUser()?'<button class="btn secondary" onclick="directiveModal()">+ 개인 업무지시</button>':''}<button class="btn" onclick="generalTaskModal()">+ 새 업무 등록</button></div></div>
 <div class="guide-strip"><div class="row"><div class="guide-icon">?</div><div><b>홈 화면 가이드</b><div class="muted">오늘 처리할 업무·승인·데이터 처리 현황을 확인하는 방법</div></div></div><div class="row"><button class="btn secondary" onclick="showScreenGuide(currentView)">가이드 보기</button><button class="btn secondary" onclick="downloadScreenGuide(currentView)">상세 가이드 다운로드</button></div></div>
 ${homeDirectiveSection(inDirectives||[],outDirectives||[])}
 ${homeStatusStrip(notices||[],open,completion)}
 <div class="flow-card section">
   <div class="flow-title row" style="justify-content:space-between"><div><div class="page-kicker">WORKSPACE FLOW</div><h3>업무 진행 처리 현황</h3></div><button class="btn secondary" onclick="projectList()">프로젝트 보기 →</button></div>
   <div class="flow-grid">
     ${flowStep('대기',todo.length,25,'TODO')}${flowStep('진행 중',doing.length,45,'IN_PROGRESS')}${flowStep('검토 대기',review.length,20,'REVIEW')}${flowStep('완료',done.length,completion,'DONE')}
     <div class="flow-side"><div class="muted">현재 승인 병목</div><b>${waitingApprovals?'승인 대기 '+waitingApprovals+'건':'병목 없음'}</b><div class="muted">${waitingApprovals?'확인 필요':'정상 운영'}</div></div>
     <div class="flow-side"><div class="muted">프로젝트 평균 진행률</div><b>${avg}%</b><div class="muted">${projectsNow.length}개 프로젝트</div></div>
     <div class="flow-side"><div class="muted">이번 주 완료율</div><b>${completion}%</b><div class="muted">전체 업무 기준</div></div>
   </div>
 </div>
 <div class="home-bottom section">
   <div class="clean-list"><div class="clean-list-head"><div><div class="page-kicker">MY WORK</div><h3>오늘의 업무</h3></div><button class="btn secondary" onclick="mywork('mine')">전체 보기 →</button></div>
   ${todayTasks.map(t=>`<div class="clean-row" style="cursor:default"><span class="clean-check"></span><div><b>${esc(t.title)}</b><div class="muted">${t.due_date?'마감 '+t.due_date:'오늘'} · ${t.team_name||''} · ${statusNames[t.status]}</div></div><span class="pill ${t.priority}">${priorityNames[t.priority]}</span></div>`).join('')||'<div class="muted" style="padding:18px">오늘 처리할 업무가 없습니다.</div>'}
   </div>
   <div class="clean-list"><div class="clean-list-head"><div><div class="page-kicker">PROCESS</div><h3>우선 처리 현황</h3></div><span class="pill URGENT">${priority.length}건</span></div>
   ${priority.slice(0,6).map(t=>`<div class="process-row" onclick="openTaskDetail(${t.id})"><span class="process-dot">${t.status==='BLOCKED'?'!':'↑'}</span><div><b>${esc(t.title)}</b><div class="muted">${t.project_name||t.team_name||''} · ${t.assignee_name||''}</div></div><span class="muted">${t.due_date||''}</span></div>`).join('')||'<div class="muted" style="padding:18px">현재 우선 처리 업무가 없습니다.</div>'}
   </div>
 </div>`;
}

function isExecutiveUser(){return currentUser&&(currentUser.name==='이원행'||currentUser.role==='DIVISION_ADMIN'||(currentUser.job_title||'').includes('이사'))}
function isLeaderOrAbove(){if(!currentUser)return false;let jt=(currentUser.job_title||'')+' '+(currentUser.rank||'');return currentUser.is_team_leader==1||['SUPER_ADMIN','DIVISION_ADMIN'].includes(currentUser.role)||['팀장','이사','본부장','부서장','대표'].some(k=>jt.includes(k))}
function homeDirectiveSection(incoming=[],outgoing=[]){
 if(isExecutiveUser()){
   let recent=outgoing.slice(0,4);
   return `<div class="home-directive-card section"><div class="home-directive-head"><div><div class="page-kicker">EXECUTIVE DIRECTIVE</div><h3>업무지시 센터</h3><div class="muted">개인별 업무지시를 전달하고 답변·진행상태를 확인합니다.</div></div><div class="row"><span class="pill">${outgoing.length}건</span><button class="btn" onclick="directiveModal()">+ 업무지시 작성</button></div></div>
   <div class="home-directive-list">${recent.map(d=>homeDirectiveItem(d,true)).join('')||'<div class="muted">보낸 업무지시가 없습니다.</div>'}</div></div>`;
 }
 let pending=incoming.filter(d=>d.status!=='CLOSED'),recent=pending.slice(0,4);
 if(!incoming.length)return '';
 return `<div class="home-directive-card section"><div class="home-directive-head"><div><div class="page-kicker">DIRECTIVE FROM EXECUTIVE</div><h3>이사 업무지시</h3><div class="muted">수신한 업무지시를 확인하고 홈에서 바로 답변할 수 있습니다.</div></div><div class="row"><span class="pill URGENT">${pending.length}건</span><button class="btn secondary" onclick="notificationsView()">전체 보기</button></div></div><div class="home-directive-list">${recent.map(d=>homeDirectiveItem(d,false)).join('')||'<div class="muted">처리할 업무지시가 없습니다.</div>'}</div></div>`;
}
function homeNoticeSection(notices){
 let canPost=isSuperAdmin();
 let items=(notices||[]).slice(0,4);
 return `<div class="home-notice-card section"><div class="home-directive-head"><div><div class="page-kicker">COMPANY NOTICE</div><h3>공지사항</h3><div class="muted">전사 공지와 업무 기준을 한곳에서 확인합니다.</div></div><div class="row"><span class="pill">${(notices||[]).length}건</span>${canPost?'<button class="btn secondary" onclick="noticeModal()">+ 공지 등록</button>':''}</div></div>
 <div class="home-notice-list">${items.map(n=>`<div class="home-notice-item" onclick="openNotice(${n.id})">${n.pinned?'<span class="pill URGENT">중요</span> ':''}<span class="pill">${esc(n.category||'일반')}</span> <b>${esc(n.title)}</b><div class="muted" style="margin-top:6px">${esc((n.body||'').slice(0,90))}${(n.body||'').length>90?'…':''}</div><div class="muted" style="margin-top:4px;font-size:12px">${esc(n.author_name||'관리자')}${n.author_team?' · '+esc(n.author_team):''} · ${(n.created_at||'').slice(0,10)}</div></div>`).join('')||'<div class="muted" style="padding:14px">등록된 공지가 없습니다.</div>'}</div></div>`;
}
async function openNotice(id){
 let n=await api('/api/notices/'+id);

async function sendQuickDirective(){
 const draft=window._quickDirectiveDraft;
 const body=(document.getElementById('hqd_body')?.value||'').trim();
 const btn=document.getElementById('hqd_submit');
 const err=document.getElementById('hqd_error');
 if(!draft){alert('업무지시 정보가 없습니다. 다시 작성해주세요.');return}
 if(!body){alert('지시 내용을 입력해주세요.');return}
 if(btn){btn.disabled=true;btn.textContent='전달 중...'}
 if(err){err.style.display='none';err.textContent=''}
 try{
   const result=await api('/api/directives',{
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({
       sender_id:currentUser.id,
       recipient_id:draft.recipient,
       title:draft.title,
       body,
       priority:draft.priority,
       due_date:draft.due||null
     })
   });
   if(!result||result.error)throw new Error(result?.error||'업무지시 저장에 실패했습니다.');
   window._quickDirectiveDraft=null;
   closeModal();
   toast('업무지시를 전달했습니다. 담당자 알림에도 등록되었습니다.');
   await updateNotifBadge();

 }catch(e){
   if(err){err.textContent=e.message||'업무지시 전달 중 오류가 발생했습니다.';err.style.display='block'}
   else alert(e.message||'업무지시 전달 중 오류가 발생했습니다.');
 }finally{
   if(btn){btn.disabled=false;btn.textContent='업무지시 전달'}
 }
}

function enableMyWorkDrag(scope){
 let dragged=null;
 document.querySelectorAll('.work-board .task').forEach(el=>{
  el.ondragstart=()=>{dragged=el;el.classList.add('dragging')};
  el.ondragend=()=>{el.classList.remove('dragging');document.querySelectorAll('.work-board .col').forEach(c=>c.classList.remove('drag-over'))};
 });
 document.querySelectorAll('.work-board .col').forEach(col=>{
  col.ondragover=e=>{e.preventDefault();col.classList.add('drag-over')};
  col.ondragleave=()=>col.classList.remove('drag-over');
  col.ondrop=async e=>{
   e.preventDefault();col.classList.remove('drag-over');if(!dragged)return;
   let id=+dragged.dataset.id,status=col.dataset.status;
   await api(`/api/tasks/${id}/move`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,order:Date.now()%1000000,actor_id:currentUser.id})});
   toast(`${statusNames[status]} 단계로 이동했습니다.`);mywork(scope);updateSidebarBadges();
  }
 });
}

// 슬라이드5: 검토 대기 + 완료 보고를 하나로 통합 — 대기 / 반려(거절) / 완료(컨펌)
// 팀장 이상: '내가 처리' / '상위 결재 대기' 토글로 분리(현재 처리 주체 기준)
function approvalCourt(t){
 // 반환: 'ME'(내가 처리해야) | 'ABOVE'(내가 처리 후 윗선 대기) | 'UPCOMING'(아직 내 차례 전 — 아래 단계 대기, 승인현황 미표시)
 let isSubmitter=(t.assignee_id===currentUser.id||t.created_by===currentUser.id);
 if((t.rejected_count||0)>0 && t.status!=='REVIEW' && t.status!=='DONE') return isSubmitter?'ME':'ABOVE';
 if(t.status==='DONE') return isSubmitter?'ABOVE':'ME';
 // 진행 중(검토 대기)
 if(t.current_approver_id&&t.current_approver_id===currentUser.id) return 'ME';       // 지금 내 차례
 if(isSubmitter) return 'ABOVE';                                                        // 내가 상신 → 결재선 대기
 if(t.viewer_approval_status==='APPROVED'||t.viewer_approval_status==='SKIPPED') return 'ABOVE'; // 내가 이미 처리 → 윗선 대기
 return 'UPCOMING';                                                                     // 나보다 아래 단계 대기(아직 내게 안 옴)
}
async function approvalStatusView(){
 let tasks=await api(`/api/work-management?viewer_id=${currentUser.id}&scope=approval`);
 window._myWorkScope='approval';
 let group=t=>{if(t.status==='DONE')return 'DONE';if((t.rejected_count||0)>0&&t.status!=='REVIEW')return 'REJECT';return 'WAIT'};
 let cols=[['WAIT','대기','승인 대기 중인 업무'],['REJECT','반려(거절)','반려되어 재작업이 필요한 업무'],['DONE','완료(컨펌)','최종 승인 완료된 업무']];
 let leader=isLeaderOrAbove();
 let court=window._approvalCourt||'ME';
 let shown=tasks;
 let meCount=0,aboveCount=0,upcomingCount=0;
 if(leader){tasks.forEach(t=>{let c=approvalCourt(t);if(c==='ME')meCount++;else if(c==='ABOVE')aboveCount++;else upcomingCount++;});shown=tasks.filter(t=>approvalCourt(t)===court);}
 let boardHtml=`<div class="board work-board section">${cols.map(col=>{let arr=shown.filter(t=>group(t)===col[0]);return `<div class="col"><div class="stage-head"><h4>${col[1]}</h4><span class="count-badge">${arr.length}</span></div><div class="muted" style="padding:0 6px 8px;font-size:12px">${col[2]}</div><div class="drop">${arr.map(workManagementCard).join('')||'<div class="muted">업무 없음</div>'}</div></div>`}).join('')}</div>`;
 let toggleHtml=leader?`<div class="approval-court-toggle section"><button class="court-chip ${court==='ME'?'active':''}" onclick="setApprovalCourt('ME')"><b>내가 처리</b><span>${meCount}건</span><small>지금 내가 승인·처리할 차례</small></button><button class="court-chip ${court==='ABOVE'?'active':''}" onclick="setApprovalCourt('ABOVE')"><b>상위 결재 대기</b><span>${aboveCount}건</span><small>내가 올렸거나 승인한 뒤 윗선 처리 대기</small></button></div>${upcomingCount?`<div class="muted section" style="margin-top:-6px;font-size:12.5px">※ 아직 내 차례가 아닌 하위 단계 대기 ${upcomingCount}건은 여기 표시되지 않습니다(‘내 업무’에서 확인).</div>`:''}`:'';
 let subMsg=leader?(court==='ME'?'지금 내가 직접 승인·처리해야 하는 검토·컨펌형 업무입니다.':'내가 상신했거나 이미 승인해 나보다 위 단계(상사) 결재를 기다리는 업무입니다.'):'내가 담당·작성·승인선에 관여한 검토·컨펌형 업무를 대기/반려/완료로 모아 봅니다.';
 view.innerHTML=`<div class="row" style="justify-content:space-between"><div><div class="eyebrow">WORK MANAGEMENT</div><h2>업무 관리</h2><div class="muted">검토·컨펌형 업무의 승인 현황을 대기·반려·완료로 확인합니다.</div></div><button class="btn" onclick="generalTaskModal()">+ 새 업무 등록</button></div>
 ${myworkTabsHtml('approval')}
 <div class="card section"><b>업무 승인 현황</b><div class="muted">${subMsg}</div></div>
 ${toggleHtml}
 ${boardHtml}`;
}

function historyEventFromLog(l){
 let action=l.action||'',title='업무 변경',detail='',kind='';
 if(action==='CREATE'){title='업무 등록';detail=`업무를 등록했습니다. ${l.new_value||''}`}
 else if(action==='ASSIGNEE'){title='담당자 배정';detail=`담당자를 ${l.new_value||''}(으)로 지정했습니다.`}
 else if(action==='STATUS'){title='업무 상태 설정';detail=`${statusNames[l.new_value]||l.new_value} 상태로 등록했습니다.`}
 else if(action==='MOVE'){title='업무 단계 이동';detail=`${statusNames[l.old_value]||l.old_value||'-'} → ${statusNames[l.new_value]||l.new_value}`;if(l.new_value==='DONE')kind='done'}
 else if(action==='REVIEW_REQUEST'){title='검토 요청';detail=l.new_value||'검토 요청 내역이 등록되었습니다.';kind='comment'}
 else if(action==='APPROVE'){title='검토 승인';detail=l.new_value||'검토자가 업무를 승인했습니다.';kind='done'}
 else if(action==='REJECT'){title='검토 반려';detail='검토자가 업무를 반려하여 진행 중으로 되돌렸습니다.';kind='reject'}
 else if(action==='COMMENT'){title='댓글 등록';detail=l.new_value||'';kind='comment'}
 else if(action==='PRIORITY'){title='우선순위 변경';detail=`${priorityNames[l.old_value]||l.old_value} → ${priorityNames[l.new_value]||l.new_value}`}
 else if(action.startsWith('UPDATE_')){
   let field=action.replace('UPDATE_',''),names={TITLE:'업무명',DESCRIPTION:'설명',STATUS:'상태',ASSIGNEE_ID:'담당자',DUE_DATE:'마감일',TEAM_ID:'주관팀',VISIBILITY_SCOPE:'공유범위',COMPLETION_MODE:'완료방식',REVIEWER_ID:'승인자'};
   title=(names[field]||field)+' 변경';detail=`${l.old_value||'-'} → ${l.new_value||'-'}`;
 } else {title=action;detail=`${l.old_value||''}${l.old_value||l.new_value?' → ':''}${l.new_value||''}`}
 return {kind,title,detail,actor:l.actor_name||'시스템',actor_meta:[l.actor_team_name,l.actor_job_title||l.actor_rank].filter(Boolean).join(' · '),created_at:l.created_at};
}

 <div class="form-section"><div class="two"><div><label>주관팀</label><select id="gt_team" onchange="generalTaskTeamChanged()">${teams.filter(t=>t.active).map(t=>`<option value="${t.id}" ${t.id==defaultTeam?'selected':''}>${t.name}</option>`)}</select></div><div><label>업무 카테고리</label><select id="gt_category"></select></div></div>
 <div class="two"><div><label>마감일</label><input id="gt_due" type="date"></div><div><label>우선순위</label><select id="gt_priority"><option value="NORMAL">일반</option><option value="HIGH">높음</option><option value="URGENT">긴급</option><option value="LOW">낮음</option></select></div></div>
 <label>업무 지시사항</label><textarea id="gt_desc" rows="4" placeholder="수행 기준, 참고사항, 보고할 결과물을 입력하세요."></textarea></div>
 <div class="form-section"><label>공유 범위</label><div class="scope-grid">
   ${scopeCard('ASSIGNEE','담당자','작성자·담당자·관리자')}
   ${scopeCard('TEAM','주관팀','주관팀 구성원',true)}
   ${scopeCard('RELATED','관련 팀','선택한 협업팀까지')}
   ${scopeCard('DEPARTMENT','관련 부서','선택한 부서 전체')}
   ${scopeCard('DEPARTMENT','전사','전체 부서')}
 </div><input type="hidden" id="gt_visibility" value="TEAM"><div id="gt_related_wrap" style="display:none"><label>관련 팀 선택</label><div class="checkbox-grid">${teams.filter(t=>t.active&&t.id!=defaultTeam).map(t=>`<label class="check-card"><input type="checkbox" class="gt_related" value="${t.id}"> ${t.name}</label>`).join('')}</div></div></div>
 <div class="form-section"><label>완료 방식</label><div class="complete-grid">
   ${completeCard('REVIEW','검토·컨펌형','검토자가 승인해야 최종 완료',true)}
   ${completeCard('REPORT','완료보고형','완료보고 등록 후 즉시 완료')}
 </div><input type="hidden" id="gt_completion" value="REVIEW">
 <div id="gt_reviewer_wrap"><label>검토·승인선</label><div class="approval-selector"><div class="muted">선택한 순서대로 검토가 진행되며 실제 승인자를 지정할 수 있습니다.</div><div class="approval-role-row" style="margin-top:10px">${approvalChip('TEAM_LEADER','팀장')}${approvalChip('DIVISION','부서장')}${approvalChip('HEAD','본부장')}${approvalChip('EXEC','담당 임원')}${approvalChip('CEO','대표이사')}</div><div class="row" style="margin-top:10px"><select id="gt_custom_approver"></select><button type="button" class="btn secondary" onclick="addCustomApproval()">+ 지정 승인자 추가</button></div><div id="gt_approval_preview" class="approval-preview"></div></div><input type="hidden" id="gt_approver_type" value=""></div></div>
 <div class="form-section"><label>담당자 <span class="muted">(여러 명 지정 가능 · 예: 기획담당 / 디자인담당)</span></label>
  <div class="two"><div><select id="gt_assignee_pick"></select></div><div><input id="gt_assignee_role" placeholder="역할(선택): 기획담당 등"></div></div>
  <button type="button" class="btn secondary" onclick="addTaskAssignee()">+ 담당자 추가</button>
  <div id="gt_assignee_list" style="margin-top:8px"></div>
  <select id="gt_assignee" style="display:none" onchange="syncApprovalLine()"></select></div>
 <div class="row" style="justify-content:flex-end"><button class="btn secondary" onclick="closeModal();document.getElementById('modal').classList.remove('full-modal')">취소</button><button class="btn" onclick="saveGeneralTask()">업무 등록</button></div>`);
 generalTaskTeamChanged(defaultTeam);
}
function scopeCard(value,title,desc,selected=false){return `<button type="button" class="scope-card ${selected?'selected':''}" data-scope="${value}" onclick="selectGeneralScope(this,'${value}')"><b>${title}</b><small>${desc}</small></button>`}
function completeCard(value,title,desc,selected=false){return `<button type="button" class="complete-card ${selected?'selected':''}" data-complete="${value}" onclick="selectGeneralComplete(this,'${value}')"><b>${title}</b><small>${desc}</small></button>`}
function approvalChip(value,title,selected=false){return `<button type="button" class="approval-role-chip ${selected?'selected':''}" data-value="${value}" onclick="toggleApprovalRole(this,'${value}')">${title}</button>`}
function selectGeneralScope(btn,value){document.querySelectorAll('.scope-card').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');gt_visibility.value=value;gt_related_wrap.style.display=value==='RELATED'?'block':'none'}
function selectGeneralComplete(btn,value){let same=btn.classList.contains('selected');document.querySelectorAll('.complete-card').forEach(x=>x.classList.remove('selected'));if(same){gt_completion.value='';gt_reviewer_wrap.style.display='none'}else{btn.classList.add('selected');gt_completion.value=value;gt_reviewer_wrap.style.display=value==='REVIEW'?'block':'none';if(value==='REVIEW')syncApprovalLine()}}
function resolveApprovalRole(role){
 let tid=+gt_team.value;
 if(role==='TEAM_LEADER')return users.find(u=>u.active!==0&&u.team_id===tid&&u.is_team_leader);
 if(role==='EXEC')return users.find(u=>u.active!==0&&u.name==='이원행')||users.find(u=>u.active!==0&&((u.job_title||'').includes('이사')||(u.rank||'').includes('이사')));
 if(role==='DIVISION'||role==='HEAD')return users.find(u=>u.active!==0&&u.role==='DIVISION_ADMIN'&&u.name!==currentUser.name)||users.find(u=>u.active!==0&&u.name==='이원행');
 if(role==='CEO')return users.find(u=>u.active!==0&&((u.job_title||'').includes('대표')||(u.rank||'').includes('대표')));
 return null
}
function toggleApprovalRole(btn,role){btn.classList.toggle('selected');syncApprovalLine()}
function addCustomApproval(){let uid=+gt_custom_approver.value;if(!uid)return;window._gtCustomApprovals=window._gtCustomApprovals||[];if(!window._gtCustomApprovals.includes(uid))window._gtCustomApprovals.push(uid);syncApprovalLine()}
function syncApprovalLine(){
 // 담당자(assignee)만 승인선에서 제외한다. 작성자(팀장 등)는 승인자가 될 수 있으며,
 // 실제 검토 요청 시 요청자/담당자는 백엔드에서 자동 건너뜀 처리된다.
 let ids=[],labels=[],excluded=new Set([+document.getElementById('gt_assignee')?.value].filter(Boolean));
 document.querySelectorAll('.approval-role-chip.selected').forEach(btn=>{
   let p=resolveApprovalRole(btn.dataset.value);
   if(p&&!excluded.has(p.id)&&!ids.includes(p.id)){ids.push(p.id);labels.push({label:btn.textContent.trim(),name:p.name})}
 });
 (window._gtCustomApprovals||[]).forEach(uid=>{let p=users.find(u=>u.id===uid);if(p&&!excluded.has(uid)&&!ids.includes(uid)){ids.push(uid);labels.push({label:'지정',name:p.name})}});
 window._gtApprovalIds=ids;
 let preview=document.getElementById('gt_approval_preview');if(!preview)return;
 preview.innerHTML=labels.length?labels.map((x,i)=>`${i?'<span class="approval-arrow">→</span>':''}<span class="approval-stage"><span class="num">${i+1}</span>${esc(x.label)} · ${esc(x.name)}</span>`).join(''):'<span class="muted">요청자·담당자를 제외한 승인자를 선택해주세요.</span>';
}

function generalTaskTeamChanged(tid=null){
 tid=+(tid||gt_team.value);
 let pick=document.getElementById('gt_assignee_pick');
 if(pick)pick.innerHTML=users.filter(u=>u.active!==0&&u.team_id==tid).map(u=>`<option value="${u.id}">${u.name} · ${u.rank||''}</option>`).join('');
 gt_category.innerHTML=teamCategories(tid).map(x=>`<option>${x}</option>`).join('');
 let approvers=users.filter(u=>u.active!==0&&(u.is_team_leader||u.role==='DIVISION_ADMIN'||(u.job_title||'').includes('대표')));
 gt_custom_approver.innerHTML=approvers.map(u=>`<option value="${u.id}">${u.name} · ${u.team_name||'총괄'} ${u.job_title||u.rank||''}</option>`).join('');
 window._gtAssignees=[];renderTaskAssignees();window._gtCustomApprovals=[];syncApprovalLine();
}
function addTaskAssignee(){
 let pick=document.getElementById('gt_assignee_pick');let uid=+pick.value;if(!uid)return;
 let u=users.find(x=>x.id===uid);let role=document.getElementById('gt_assignee_role').value.trim();
 window._gtAssignees=window._gtAssignees||[];
 if(window._gtAssignees.some(a=>a.user_id===uid)){alert('이미 추가된 담당자입니다.');return}
 window._gtAssignees.push({user_id:uid,role_label:role,name:u?u.name:''});
 document.getElementById('gt_assignee_role').value='';
 renderTaskAssignees();
}
function removeTaskAssignee(uid){window._gtAssignees=(window._gtAssignees||[]).filter(a=>a.user_id!==uid);renderTaskAssignees();}
function renderTaskAssignees(){
 let list=window._gtAssignees||[];let el=document.getElementById('gt_assignee_list');if(!el)return;
 el.innerHTML=list.length?list.map((a,i)=>`<span class="pill" style="margin:2px 4px 2px 0;padding:6px 10px">${i===0?'<b>주담당</b> ':''}${esc(a.name)}${a.role_label?' · '+esc(a.role_label):''} <a onclick="removeTaskAssignee(${a.user_id})" style="cursor:pointer;color:#c0392b">×</a></span>`).join(''):'<span class="muted">담당자를 추가하세요(미지정 가능).</span>';
 // 주 담당자(첫 번째)를 hidden gt_assignee에 반영 → 승인선 제외/호환
 let ga=document.getElementById('gt_assignee');if(ga){ga.innerHTML=list.map(a=>`<option value="${a.user_id}">${a.name}</option>`).join('');ga.value=list[0]?list[0].user_id:'';}
 syncApprovalLine();
}
async function saveGeneralTask(){
 if(!gt_title.value.trim()){alert('업무명을 입력해주세요.');return}
 if(!gt_completion.value){alert('완료 방식을 선택해주세요.');return}
 if(gt_completion.value==='REVIEW'&&!(window._gtApprovalIds||[]).length){alert('검토 승인자를 1명 이상 선택해주세요.');return}
 let related=[...document.querySelectorAll('.gt_related:checked')].map(x=>x.value).join(',');
 let assignees=(window._gtAssignees||[]).map(a=>({user_id:a.user_id,role_label:a.role_label||''}));
 let primary=assignees[0]?assignees[0].user_id:null;
 await api('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_id:null,work_type:'GENERAL',title:gt_title.value.trim(),team_id:+gt_team.value,assignee_id:primary,assignees,category:gt_category.value,priority:gt_priority.value,due_date:gt_due.value||null,description:gt_desc.value,visibility_scope:gt_visibility.value,related_team_ids:related,completion_mode:gt_completion.value,reviewer_id:gt_completion.value==='REVIEW'?(window._gtApprovalIds?.[0]||null):null,approver_ids:gt_completion.value==='REVIEW'?(window._gtApprovalIds||[]):[],created_by:currentUser.id})});
 closeModal();document.getElementById('modal').classList.remove('full-modal');toast('일반 업무를 등록했습니다.');mywork('mine');
}
async function managementMyWork(isDivision){
 view.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div><h3>${isDivision?'콘텐츠사업부 전체 업무':'소속팀 업무 현황'}</h3><div class="muted">${isDivision?'보고 싶은 팀과 구성원을 선택해 전체 업무 흐름을 확인합니다.':'본인·팀원 업무와 공유범위에 따라 공유된 업무를 함께 확인합니다.'}</div></div><div class="row">${isDivision?`<select id="mg_team" onchange="managementTeamChanged()" style="width:auto"><option value="">전체 팀</option>${teams.filter(t=>t.active).map(t=>`<option value="${t.id}">${t.name}</option>`)}</select>`:''}<select id="mg_member" onchange="loadManagement()" style="width:auto"></select></div></div></div><div id="mg_body" class="section"></div>`;
 await fillManagementMembers(isDivision?'':currentUser.team_id);
 await loadManagement();
}
async function managementTeamChanged(){await fillManagementMembers(document.getElementById('mg_team').value);loadManagement()}
async function fillManagementMembers(teamId){
 let sel=document.getElementById('mg_member');if(!sel)return;
 let list=users.filter(u=>u.active!==0&&u.team_id&&(!teamId||u.team_id==teamId));
 sel.innerHTML='<option value="">전체 구성원</option>'+list.map(u=>`<option value="${u.id}">${u.name} · ${u.team_name}</option>`).join('');
}
async function loadManagement(){
 let team=document.getElementById('mg_team')?.value||currentUser.team_id||'';
 let member=document.getElementById('mg_member')?.value||'';
 let q=`/api/management/tasks?viewer_id=${currentUser.id}`+(team?`&team_id=${team}`:'')+(member?`&member_id=${member}`:'');
 let tasks=await api(q),active=tasks.filter(t=>t.status!=='DONE');
 let delayed=active.filter(t=>t.due_date&&new Date(t.due_date)<new Date()).length;
 let groups={};active.forEach(t=>{let k=t.assignee_name||'미배정';(groups[k]??=[]).push(t)});
 window._managementTasks=active;document.getElementById('mg_body').innerHTML=`<div class="management-summary">${metric('진행 업무',active.length,`showManagementDrill('active')`)}${metric('막힘',active.filter(t=>t.status==='BLOCKED').length,`showManagementDrill('blocked')`)}${metric('긴급',active.filter(t=>t.priority==='URGENT').length,`showManagementDrill('urgent')`)}${metric('검토대기',active.filter(t=>t.status==='REVIEW').length,`showManagementDrill('review')`)}${metric('지연',delayed,`showManagementDrill('delayed')`)}</div>
 <div class="card"><h3>우선 확인 필요 업무</h3>${active.filter(t=>t.status==='BLOCKED'||t.priority==='URGENT'||(t.due_date&&new Date(t.due_date)<new Date())).map(taskCard).join('')||'<div class="muted">현재 우선 확인 대상이 없습니다.</div>'}</div>
 <div class="section">${Object.entries(groups).map(([name,arr])=>`<div class="person-block"><div class="person-head"><div><b>${name}</b><span class="pill">${arr[0]?.team_name||''}</span></div><div class="muted">진행 ${arr.length} · 막힘 ${arr.filter(x=>x.status==='BLOCKED').length}</div></div>${arr.map(taskCard).join('')}</div>`).join('')||'<div class="muted">표시할 업무가 없습니다.</div>'}</div>`;
}
function renderBoard(tasks){window._currentBoardTasks=tasks;view.innerHTML=`<div class="muted" style="margin-bottom:10px">업무 카드를 좌우로 드래그하면 단계가 변경되고 DB에 저장됩니다. 단계별 숫자를 클릭하면 해당 업무만 볼 수 있습니다.</div><div class="board">${['TODO','IN_PROGRESS','BLOCKED','REVIEW','DONE'].map(s=>{let arr=tasks.filter(t=>t.status===s);return `<div class="col" data-status="${s}"><div class="stage-head"><h4>${statusNames[s]}</h4><span class="count-badge" onclick="event.stopPropagation();showBoardStage('${s}')">${arr.length}</span></div><div class="drop">${arr.map(taskCard).join('')}</div></div>`}).join('')}</div>`;enableBoardDrag()}

function blockedPriorityCard(t){
 return `<div class="blocked-card"><div class="blocked-header"><div><span class="pill URGENT">막힘</span><span class="pill">${t.team_name||'-'}</span><b>${esc(t.title)}</b><div class="muted">${t.project_name||''} · 담당 ${t.assignee_name||'미배정'} · 마감 ${t.due_date||'-'}</div></div><button class="btn secondary" onclick="openTaskDetail(${t.id})">업무 열기</button></div>
 <div class="why"><b>막힘 사유</b><br>${esc(t.blocked_reason||'막힘 사유가 아직 등록되지 않았습니다.')}</div>
 <div class="blocked-actions"><button class="btn" onclick="resolveBlocked(${t.id})">결정/조율 후 진행중 전환</button><button class="btn secondary" onclick="openTaskDetail(${t.id})">댓글·상세 확인</button></div></div>`;
}
async function resolveBlocked(id){
 if(!confirm('해당 막힘 업무를 진행중으로 전환하시겠습니까?'))return;
 await api(`/api/tasks/${id}/move`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'IN_PROGRESS',order:Date.now()%1000000,actor_id:currentUser.id})});
 toast('막힘을 해제하고 진행중으로 전환했습니다.');home();
}

function taskCard(t){
 let shared=t.assignee_id!=currentUser.id?`<span class="pill">공유</span>`:'';
 return `<div class="task" draggable="true" ondblclick="openTaskDetail(${t.id})" data-id="${t.id}" data-status="${t.status}"><div class="row"><span class="pill ${t.priority}">${priorityNames[t.priority]}</span><span class="pill">${t.team_name||'-'}</span>${shared}</div><div class="title">${t.title}</div><div class="small">${t.project_name||''}<br>${t.assignee_name||'미배정'} · 마감 ${t.due_date||'-'}</div></div>`}
function enableBoardDrag(){let dragged=null;document.querySelectorAll('.task').forEach(el=>{el.ondragstart=()=>{dragged=el;el.classList.add('dragging')};el.ondragend=()=>el.classList.remove('dragging')});document.querySelectorAll('.col').forEach(col=>{col.ondragover=e=>e.preventDefault();col.ondrop=async e=>{e.preventDefault();if(!dragged)return;const status=col.dataset.status,id=dragged.dataset.id;col.querySelector('.drop').appendChild(dragged);await api(`/api/tasks/${id}/move`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,order:Date.now()%1000000,actor_id:currentUser.id})});toast(`${statusNames[status]} 단계로 이동했습니다.`);
 if(navContext.projectId) await refreshProject(navContext.projectId,navContext.projectMode||'KANBAN');
 else await refreshCurrentContext()}})}
function enablePriorityDrag(){let list=document.getElementById('priorityList'),drag=null;if(!list)return;list.querySelectorAll('.task').forEach(el=>{el.ondragstart=()=>drag=el;el.ondragover=e=>{e.preventDefault();let target=e.currentTarget;if(target!==drag){let box=target.getBoundingClientRect();list.insertBefore(drag,(e.clientY-box.top)>box.height/2?target.nextSibling:target)}}});list.ondrop=async e=>{e.preventDefault();let cards=[...list.querySelectorAll('.task')];for(let i=0;i<cards.length;i++){let t=cards[i],p=[...t.querySelectorAll('.pill')][0].classList[1]||'NORMAL';await api(`/api/tasks/${t.dataset.id}/priority`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({priority:p,order:i+1,actor_id:currentUser.id,reason:'드래그 순서 조정'})})}toast('우선순위를 저장했습니다.');if(navContext.projectId)await refreshProject(navContext.projectId,navContext.projectMode||'DASHBOARD');else await refreshCurrentContext()}}
const PROJECT_TABS={mine:'내 프로젝트',all:'전체 프로젝트',history:'프로젝트 히스토리'};
function projectIsDone(p){return (p.task_count>0&&p.done_count>=p.task_count)||['DONE','CLOSED','COMPLETED'].includes(p.status)}
function projectIsArchived(p){return p.status==='HOLD'||projectIsDone(p)}
async function projectList(selectedId=null,tab){
 if(tab)window._projectTab=tab; let ptab=window._projectTab||'mine';
 if(ptab==='history')return projectHistoryView(selectedId);
 projects=await api('/api/projects?viewer_id='+currentUser.id);
 let canCreate=true; // 누구나 등록(사원 건은 팀장 승인)
 let filtered=projects.filter(p=>{
   if(projectIsArchived(p))return false; // 진행 중 탭에서는 완료·보류 프로젝트 제외(히스토리에서 확인)
   if(ptab==='mine')return !!p.is_member;
   return true; // all
 });
 let selected=filtered.find(p=>p.id==selectedId)||filtered[0];
 view.innerHTML=`<div class="guide-strip"><div class="row"><div class="guide-icon">?</div><div><b>프로젝트 화면 가이드</b><div class="muted">내 프로젝트·전체 프로젝트·프로젝트 히스토리로 나누어 확인합니다.</div></div></div><div class="row"><button class="btn secondary" onclick="showScreenGuide(currentView)">가이드 보기</button></div></div>
 <div class="view-tabs">${Object.entries(PROJECT_TABS).map(([k,v])=>`<button class="${ptab===k?'active':''}" onclick="projectList(null,'${k}')">${v}</button>`).join('')}</div>
 <div class="project-layout section"><aside class="project-sidebar"><div class="project-sidebar-head row" style="justify-content:space-between"><div><div class="page-kicker">PROJECTS</div><h3>${PROJECT_TABS[ptab]}</h3></div>${canCreate?'<div class="row"><button class="btn secondary" onclick="templateLibrary(\'PROJECT\')">프로젝트 양식</button><button class="btn secondary" onclick="projectModal()">+ 새 프로젝트</button></div>':''}</div>
 ${filtered.map(p=>projectListItem(p,selected?.id==p.id)).join('')||'<div class="muted" style="padding:16px">해당하는 프로젝트가 없습니다.</div>'}</aside><section class="project-detail" id="projectDetailPane"></section></div>`;

   let base=new Date(),start=new Date(base.getFullYear(),base.getMonth(),1),end=new Date(base.getFullYear(),base.getMonth()+2,0),span=(end-start)||1;
   return `<div class="card timeline-view"><div class="timeline-table">${tasks.map(t=>{let d=t.due_date?new Date(t.due_date):end;let pos=Math.max(0,Math.min(95,((d-start)/span)*100));return `<div class="timeline-item"><div><b>${esc(t.title)}</b><div class="muted">${t.assignee_name||''}</div></div><div>${statusNames[t.status]}</div><div class="timeline-axis"><div class="timeline-segment" style="left:${pos}%;width:8%"></div></div><div>${t.due_date||'-'}</div></div>`}).join('')}</div></div>`;
 }
 if(mode==='CALENDAR'){
   let d=calDate,y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),cells=[];
   for(let i=0;i<42;i++){let day=new Date(start);day.setDate(start.getDate()+i);let ds=`${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;let dayTasks=tasks.filter(t=>t.due_date===ds);cells.push(`<div><b>${day.getDate()}</b>${dayTasks.map(t=>`<div class="event" ondblclick="openTaskDetail(${t.id})">${esc(t.title)}</div>`).join('')}</div>`)}return `<div class="card calendar-mini">${cells.join('')}</div>`;
 }
 if(mode==='DASHBOARD'){
   let counts={};['TODO','IN_PROGRESS','BLOCKED','REVIEW','DONE'].forEach(s=>counts[s]=tasks.filter(t=>t.status===s).length);let total=tasks.length||1;
   let deg1=counts.DONE/total*360,deg2=deg1+counts.IN_PROGRESS/total*360,deg3=deg2+counts.BLOCKED/total*360;
   return `<div class="dashboard-grid"><div class="chart-card"><h3>업무 상태 분포</h3><div class="donut-wrap"><div class="donut" style="background:conic-gradient(#10b981 0 ${deg1}deg,#f59e0b ${deg1}deg ${deg2}deg,#ef4444 ${deg2}deg ${deg3}deg,#8b5cf6 ${deg3}deg 360deg)"></div><div>${[['완료',counts.DONE],['진행중',counts.IN_PROGRESS],['막힘',counts.BLOCKED],['기타',counts.TODO+counts.REVIEW]].map(x=>`<div class="legend-row"><span class="legend-dot"></span>${x[0]} ${x[1]}</div>`).join('')}</div></div></div><div class="chart-card"><h3>프로젝트 요약</h3>${metric('전체 업무',tasks.length,`showScopedTaskDrill('프로젝트 전체 업무',{project_id:${p.id}})`)}${metric('완료',counts.DONE,`showScopedTaskDrill('프로젝트 완료 업무',{project_id:${p.id},done:true})`)}${metric('막힘',counts.BLOCKED,`showScopedTaskDrill('프로젝트 막힘 업무',{project_id:${p.id},blocked:true})`)}${metric('검토',counts.REVIEW,`showScopedTaskDrill('프로젝트 검토 업무',{project_id:${p.id},review:true})`)}</div></div>`;
 }
 return '';
}

const CAL_CATS={PERSONAL:{name:'개인',color:'#64748b'},TEAM:{name:'팀',color:'#2f80c7'},DEPARTMENT:{name:'전사',color:'#ef6a5b'},TASK:{name:'업무',color:'#7c5cff'},PROJECT:{name:'프로젝트',color:'#17a673'}};
let calMode='MONTH';
function eventCategory(e){if(String(e.id).startsWith('task-'))return e.category||'TASK';return e.category||(e.team_id?'TEAM':'DEPARTMENT')}
function catColor(e){return (CAL_CATS[eventCategory(e)]||CAL_CATS.TEAM).color}
function catName(e){return (CAL_CATS[eventCategory(e)]||CAL_CATS.TEAM).name}
function fmtDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function eventEnd(e){return e.end_date||e.start_date}
function eventOnDate(e,ds){return e.start_date<=ds&&eventEnd(e)>=ds}
async function calendarView(filter='ALL',mode){
 if(mode)calMode=mode;
 let ym=`${calDate.getFullYear()}-${String(calDate.getMonth()+1).padStart(2,'0')}`;
 let now=new Date(),todayStr=fmtDate(now);
 // 슬라이드9: TODAY/UPCOMING은 보고 있는 월과 무관하게 '오늘' 기준으로 별도 조회
 let toDate=new Date(now.getFullYear(),now.getMonth(),now.getDate()+60),toStr=fmtDate(toDate);
 let [events,upcomingRaw]=await Promise.all([
   api(`/api/calendar?viewer_id=${currentUser.id}&month=${ym}`),
   api(`/api/calendar?viewer_id=${currentUser.id}&from=${todayStr}&to=${toStr}`)
 ]);
 window._calFilter=filter;

 let upcoming=upcomingRaw.filter(e=>e.start_date>todayStr).sort((a,b)=>a.start_date.localeCompare(b.start_date)).slice(0,7);
 let bodyHtml=calMode==='MONTH'?monthCalendar(calDate,filtered):calMode==='WEEK'?weekCalendar(calDate,filtered):listCalendar(filtered);

 view.innerHTML=`<div class="guide-strip"><div class="row"><div class="guide-icon">?</div><div><b>캘린더 화면 가이드</b><div class="muted">개인·팀·전사 일정과 업무·프로젝트 마감일을 색상으로 구분해 확인합니다.</div></div></div><div class="row"><button class="btn secondary" onclick="showScreenGuide(currentView)">가이드 보기</button></div></div>
 <div class="view-tabs">${[['MONTH','월간'],['WEEK','주간'],['LIST','일정 목록']].map(m=>`<button class="${calMode===m[0]?'active':''}" onclick="calendarView('${filter}','${m[0]}')">${m[1]}</button>`).join('')}</div>
 <div class="calendar-shell section"><div class="calendar-main"><div class="calendar-toolbar"><div class="row"><button class="btn secondary" onclick="moveCal(-1)">‹</button><h3>${title}</h3><button class="btn secondary" onclick="moveCal(1)">›</button><button class="btn secondary" onclick="calDate=new Date();calendarView('${filter}')">오늘</button></div><div class="calendar-filter">${[['ALL','전체','#94a3b8'],['PERSONAL','개인',CAL_CATS.PERSONAL.color],['TEAM','팀',CAL_CATS.TEAM.color],['DEPARTMENT','전사',CAL_CATS.DEPARTMENT.color],['TASK','업무',CAL_CATS.TASK.color],['PROJECT','프로젝트',CAL_CATS.PROJECT.color]].map(x=>`<button class="cal-cat ${filter===x[0]?'active':''}" onclick="calendarView('${x[0]}','${calMode}')"><span class="cal-dot" style="background:${x[2]}"></span>${x[1]}</button>`).join('')}<button class="btn" onclick="calendarModal()">+ 일정 추가</button></div></div>${bodyHtml}</div>
 <aside class="calendar-side"><div class="side-panel"><div class="side-panel-head"><div class="page-kicker">TODAY</div><h3>${now.getMonth()+1}월 ${now.getDate()}일 ${['일','월','화','수','목','금','토'][now.getDay()]}요일 <span class="pill">${todayEvents.length}건</span></h3></div>${todayEvents.map(e=>calendarSideItem(e)).join('')||'<div class="muted" style="padding:14px">오늘 일정이 없습니다.</div>'}</div>
 <div class="side-panel"><div class="side-panel-head"><div class="page-kicker">UPCOMING</div><h3>다가오는 일정</h3></div>${upcoming.map(e=>calendarUpcomingItem(e)).join('')||'<div class="muted" style="padding:14px">다가오는 일정이 없습니다.</div>'}</div></aside></div>`;
}
function calendarSideItem(e){return `<div class="side-item" onclick="calendarEventClick('${e.id}')" style="border-left:3px solid ${catColor(e)}"><div class="row" style="justify-content:space-between"><b>${esc(e.title)}</b><span class="cal-dot" style="background:${catColor(e)}"></span></div><div class="muted">${catName(e)}${e.team_name?' · '+e.team_name:''}</div></div>`}
function calendarUpcomingItem(e){let d=new Date(e.start_date);return `<div class="side-item row" onclick="calendarEventClick('${e.id}')" style="border-left:3px solid ${catColor(e)}"><span class="date-chip"><small>${d.getMonth()+1}월</small>${d.getDate()}</span><div><b>${esc(e.title)}</b><div class="muted">${catName(e)}${e.team_name?' · '+e.team_name:''}</div></div></div>`}
function moveCal(n){if(calMode==='WEEK'){calDate=new Date(calDate.getFullYear(),calDate.getMonth(),calDate.getDate()+7*n)}else{calDate=new Date(calDate.getFullYear(),calDate.getMonth()+n,1)}calendarView(window._calFilter||'ALL')}
function moveMonth(n){moveCal(n)}
function calEventChip(e){return `<div class="event" onclick="event.stopPropagation();calendarEventClick('${e.id}')" style="border-left:3px solid ${catColor(e)};background:${catColor(e)}14"><b>${esc(e.title)}</b><small>${catName(e)}${e.team_name?' · '+e.team_name:''}</small></div>`}
function monthCalendar(d,events){
 let y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),cells=[],todayStr=fmtDate(new Date());
 for(let i=0;i<42;i++){
  let day=new Date(start);day.setDate(start.getDate()+i);
  let ds=fmtDate(day);
  let ev=events.filter(e=>eventOnDate(e,ds));
  cells.push(`<div class="day ${day.getMonth()!==m?'other':''} ${ds===todayStr?'today':''}"><div class="date">${day.getDate()}</div>${ev.map(calEventChip).join('')}</div>`)
 }
 return `<div class="calendar">${['일','월','화','수','목','금','토'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells.join('')}</div>${calLegend()}`
}
function weekStart(d){let s=new Date(d.getFullYear(),d.getMonth(),d.getDate()-d.getDay());return s}
function weekTitle(d){let s=weekStart(d),e=new Date(s);e.setDate(s.getDate()+6);return `${s.getMonth()+1}.${s.getDate()} ~ ${e.getMonth()+1}.${e.getDate()}`}
function weekCalendar(d,events){
 let s=weekStart(d),todayStr=fmtDate(new Date()),cols=[];
 for(let i=0;i<7;i++){let day=new Date(s);day.setDate(s.getDate()+i);let ds=fmtDate(day);let ev=events.filter(e=>eventOnDate(e,ds));
  cols.push(`<div class="week-col ${ds===todayStr?'today':''}"><div class="week-col-head">${['일','월','화','수','목','금','토'][i]} <b>${day.getDate()}</b></div><div class="week-col-body">${ev.map(calEventChip).join('')||'<div class="muted" style="padding:8px;font-size:12px">-</div>'}</div></div>`)}
 return `<div class="week-grid">${cols.join('')}</div>${calLegend()}`
}
function listCalendar(events){
 let sorted=[...events].sort((a,b)=>a.start_date.localeCompare(b.start_date));
 let byDate={};sorted.forEach(e=>{(byDate[e.start_date]??=[]).push(e)});
 let keys=Object.keys(byDate);
 if(!keys.length)return `<div class="card"><div class="muted">해당 월에 표시할 일정이 없습니다.</div></div>`;
 return `<div class="card cal-list">${keys.map(ds=>{let d=new Date(ds);return `<div class="cal-list-day"><div class="cal-list-date">${d.getMonth()+1}월 ${d.getDate()}일 (${['일','월','화','수','목','금','토'][d.getDay()]})</div>${byDate[ds].map(e=>`<div class="cal-list-item" onclick="calendarEventClick('${e.id}')"><span class="cal-dot" style="background:${catColor(e)}"></span><b>${esc(e.title)}</b><span class="pill">${catName(e)}</span><span class="muted">${e.team_name||''}${e.owner_name?' · '+e.owner_name:''}</span></div>`).join('')}</div>`}).join('')}</div>${calLegend()}`
}
function calLegend(){return `<div class="cal-legend">${Object.entries(CAL_CATS).map(([k,v])=>`<span class="cal-legend-item"><span class="cal-dot" style="background:${v.color}"></span>${v.name}</span>`).join('')}</div>`}

async function showDashboardMetricDrill(title,type){

async function wsDelete(path,id,reload){
 if(!confirm('이 항목을 삭제할까요? 되돌릴 수 없습니다.'))return;
 let r=await api(path+'/'+id,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor_id:currentUser.id})});
 if(r&&r.error){alert(r.error);return}
 toast('삭제했습니다.');reload();
}

async function workspaceSchedule(tid){
 let tasks=await api('/api/tasks?team_id='+tid),today=new Date();
 let w=await api('/api/workspace/'+tid);
 let rows=tasks.filter(t=>t.status!=='DONE').map(t=>{
   let overdue=t.due_date&&new Date(t.due_date)<today;
   let progress=t.status==='TODO'?15:t.status==='IN_PROGRESS'?55:t.status==='BLOCKED'?40:t.status==='REVIEW'?85:100;
   return `<div class="timeline-row ${overdue?'timeline-overdue':''}"><div><b>${esc(t.title)}</b><div class="muted">${t.project_name}</div></div><div>${t.assignee_name||'미배정'}</div><div>${t.due_date||'-'} ${overdue?'⚠️':''}</div><div><div class="timeline-bar"><div class="timeline-fill" style="width:${progress}%"></div></div><div class="muted">${statusNames[t.status]}</div></div><div>${w.resources.slice(0,2).map(r=>r.url?`<a href="${r.url}" target="_blank">📎 ${esc(r.title)}</a>`:'').join('<br>')||'<span class="muted">첨부 없음</span>'}</div></div>`;
 }).join('');
 document.getElementById('wsBody').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div><h3>팀 일정 관리</h3><div class="muted">작업내역 · 마감기한 · 일정 타임라인 · 필요한 파일을 한 화면에서 확인합니다.</div></div><button class="btn secondary" onclick="workspaceDepartmentCalendar(${tid})">부서 Calendar 보기</button></div><div class="timeline-row" style="font-weight:700;background:#fafafe"><div>작업내역</div><div>담당자</div><div>마감</div><div>타임라인/상태</div><div>관련 파일</div></div>${rows||'<div class="muted" style="padding:12px">진행중인 일정이 없습니다.</div>'}</div>`;
}

function downloadMccVerdict(id){
 let c=window._mccReviewCache;if(!c||c.review.id!=id){alert('검수 상세를 먼저 열어주세요.');return}
 let rows=c.items.filter(x=>x.decision==='승인'||x.decision==='보류'); // 승인·보류 결과만 포함
 let head=['No','위치','구분','오류내용(교재원문)','최신기준','근거','판정'];
 let esc2=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
 let lines=[head.map(esc2).join(',')].concat(rows.map(x=>[x.item_no||'',x.page_ref||'',x.category||'',x.source_text||'',x.reference_text||'',x.change_detail||'',x.decision||''].map(esc2).join(',')));
 let bom='﻿',blob=new Blob([bom+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
 let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='교재법령_검수판정표.csv';a.click();URL.revokeObjectURL(a.href);
 toast('판정표(CSV)를 내려받았습니다. 승인·보류 결과만 포함됩니다.');
}

}

 };reader.readAsDataURL(file)
}

function dataCenterTable(rows,title){
 return `<div class="card"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">PROCESSING HISTORY</div><h3>${title}</h3></div><span class="pill">${rows.length}건</span></div><table class="data-history-table"><thead><tr><th>파일/데이터</th><th>데이터 영역</th><th>크기</th><th>처리 상태</th><th>업로드/등록</th><th>등록자</th></tr></thead><tbody>${rows.map(x=>`<tr onclick="openDataCenterItem(${x.id})"><td><b>${esc(x.original_name||x.title||'-')}</b>${x.duplicate_name?`<div class="muted">중복대상: ${esc(x.duplicate_name)}</div>`:''}</td><td>${esc(x.data_type||'')}</td><td>${formatBytes(x.size_bytes||0)}</td><td><span class="${x.status==='처리완료'||x.status==='연결됨'||x.status==='사용중'?'status-ok':x.status==='오류'?'status-error':'status-warn'}">${x.status}</span></td><td>${formatDateTime(x.created_at)}</td><td>${x.uploader_name||'-'}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">등록된 데이터가 없습니다.</td></tr>'}</tbody></table></div>`;
}
function formatBytes(n){if(!n)return '-';if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}
function formatDateTime(v){return v?String(v).replace('T',' ').slice(0,16):'-'}

function newWorkChoice(value,title,desc,selected=false,group='visibility'){
 return `<button type="button" class="choice-card ${selected?'selected':''}" data-group="${group}" data-value="${value}" onclick="selectNewWorkChoice(this,'${group}','${value}')"><b>${title}</b><small>${desc}</small></button>`;
}
function selectNewWorkChoice(btn,group,value){
 let wasSelected=btn.classList.contains('selected');
 document.querySelectorAll(`.choice-card[data-group="${group}"]`).forEach(x=>x.classList.remove('selected'));
 if(wasSelected){
   if(group==='visibility'){f_visibility.value='';relatedTeamsWrap.style.display='none'}
   else if(group==='completion'){f_completion.value='';reviewerWrap.style.display='none';f_approver_type.value=''}
   else if(group==='approverType'){f_approver_type.value='';syncApproverSelection()}
   return;
 }
 btn.classList.add('selected');
 if(group==='visibility'){f_visibility.value=value;relatedTeamsWrap.style.display=value==='RELATED'?'block':'none'}
 else if(group==='completion'){
   f_completion.value=value;reviewerWrap.style.display=value==='REVIEW'?'block':'none';
   if(value!=='REVIEW'){f_approver_type.value=''}
 } else if(group==='approverType'){
   f_approver_type.value=value;syncApproverSelection();
 }
}
function syncApproverSelection(){
 let type=f_approver_type.value,tid=+f_team.value;
 if(type==='TEAM_LEADER'){
   let leader=users.find(u=>u.team_id==tid&&u.is_team_leader);
   if(leader)f_reviewer.value=leader.id;
 }else if(type==='DIRECTOR'){
   let director=users.find(u=>u.name==='이원행'||u.role==='DIVISION_ADMIN');
   if(director)f_reviewer.value=director.id;
 }
}
function teamCategories(tid){
 let m={1:['교재제작','강의촬영','시험복원','교재·법령 검수','강사관리','기타'],2:['광고','콘텐츠','캠페인','행사','협업요청','기타'],3:['교재','상품','특강','B2B','사이트운영','기타'],4:['과정개발','과정심사','국비운영','콘텐츠제작','LMS운영','기타'],6:['고객상담','회원관리','상품문의','환불','민원','기타']};return m[tid]||['일반업무','프로젝트','협업','기타'];
}
function newWorkTeamChanged(teamId=null){
 let tid=+(teamId||f_team.value),members=users.filter(u=>u.active!==0&&u.team_id==tid);
 f_assignee.innerHTML=members.map(u=>`<option value="${u.id}">${u.name} · ${u.rank||''}</option>`).join('')||'<option value="">팀 구성원 없음</option>';
 f_category.innerHTML=teamCategories(tid).map(x=>`<option>${x}</option>`).join('');
 let leader=members.find(u=>u.is_team_leader),director=users.find(u=>u.name==='이원행'||u.role==='DIVISION_ADMIN');
 let approvers=[]; if(leader)approvers.push(leader); if(director&&!approvers.some(x=>x.id===director.id))approvers.push(director);
 users.forEach(u=>{if(!approvers.some(x=>x.id===u.id))approvers.push(u)});
 f_reviewer.innerHTML='<option value="">승인자 선택</option>'+approvers.map(u=>`<option value="${u.id}">${u.name} · ${u.team_name||'콘텐츠사업부'} ${u.job_title||u.rank||''}</option>`).join('');
 syncApproverSelection();
 if(typeof relatedTeamsWrap!=='undefined'&&relatedTeamsWrap){relatedTeamsWrap.innerHTML=`<label>협업팀</label><div class="checkbox-grid">${teams.filter(t=>t.active&&t.id!=tid).map(t=>`<label class="check-card"><input type="checkbox" class="f_related_team" value="${t.id}"> ${t.name}</label>`).join('')}</div>`}
}
async function saveTask(pid){
 if(!f_title.value.trim()){alert('업무명을 입력해주세요.');return}
 if(!f_assignee.value){alert('담당자를 선택해주세요.');return}
 let related=[...document.querySelectorAll('.f_related_team:checked')].map(x=>x.value).join(',');
 let completion=f_completion.value;
 if(!completion){alert('완료 방식을 선택해주세요.');return}
 let reviewer=completion==='REVIEW'?(+f_reviewer.value||null):null;
 if(completion==='REVIEW'&&!reviewer){alert('검토·컨펌형은 승인자를 선택해주세요.');return}
 await api('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
   project_id:pid,work_type:'PROJECT',title:f_title.value.trim(),team_id:+f_team.value,assignee_id:+f_assignee.value,category:f_category.value,
   priority:f_priority.value,due_date:f_due.value||null,description:f_desc.value,visibility_scope:f_visibility.value,
   related_team_ids:related,completion_mode:completion,reviewer_id:reviewer,created_by:currentUser.id,actor_id:currentUser.id
 })});
 closeModal();toast('업무를 등록했습니다. 담당자 업무와 알림에 반영됩니다.');refreshProject(pid,navContext.projectMode||'DASHBOARD')
}

function resourceModal(tid,id){
 let x=id?(window._resRows||[]).find(r=>r.id==id):null;
 let opt=(l,v)=>l.map(o=>`<option value="${o[0]}" ${v===o[0]?'selected':''}>${o[1]}</option>`).join('');
 showModal(id?'자료/링크 수정':'자료/링크 추가',`<label>제목</label><input id="rs_title" value="${x?esc(x.title):''}">

 <div id="rs_file_wrap" style="display:${!id&&false?'block':'none'}"><label>파일 선택</label><input id="rs_file" type="file"><div class="muted">${id?'파일 교체가 필요하면 삭제 후 다시 등록하세요.':'선택한 파일은 MOA WORK의 uploads 폴더에 저장됩니다.'}</div></div>
